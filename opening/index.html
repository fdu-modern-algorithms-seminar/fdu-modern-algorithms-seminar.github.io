<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>算法必须停机、正确、而且快吗？——现代算法讨论班 · 开场</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&family=Noto+Serif+SC:wght@500;600;700&family=Noto+Sans+SC:wght@400;500;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400..700;1,8..60,400..600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.22/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.22/dist/katex.min.js"></script>
<style>
:root{
  --paper:#F6F4EE; --paper2:#FFFDF8; --ink:#14171c; --ink2:#363b44; --muted:#646a73; --faint:#9a9ea5;
  --line:#e0dcd2; --line2:#cbc6ba;
  --navy:#17305c; --blue:#1f4180; --blue2:#8aa1c8; --blue3:#d5deec; --blue4:#eaeef5;
  --rust:#b8501a;--teal:#2b6b60;--tealbg:#e2eeeb; --amber:#b8501a; --rustbg:#f7e6d9; --amberbg:#f7e6d9;
  --serif:'Source Serif 4','Noto Serif SC','Source Han Serif SC','Songti SC','STSong','SimSun',serif;
  --sans:Inter,'Noto Sans SC','PingFang SC','Microsoft YaHei','Source Han Sans SC',system-ui,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,Menlo,monospace;
  --rail:#d9d4c8; --railon:var(--navy); --footink:var(--faint);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{overflow:hidden;background:#2a2d33;color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;font-feature-settings:'cv11','ss01'}
a{color:var(--blue);text-decoration:none}
#stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
#deck{position:relative;width:1600px;height:900px;flex:none;background:var(--paper);overflow:hidden;transform-origin:center center;box-shadow:0 30px 80px rgba(0,0,0,.35)}

/* ---------- slide frame ---------- */
.slide{position:absolute;inset:0;padding:64px 96px 92px;display:none;flex-direction:column}
.slide.active{display:flex}
.slide>header{flex:none;margin-bottom:26px}
.eyebrow{display:flex;align-items:center;gap:14px;font:600 14px var(--sans);letter-spacing:.16em;text-transform:uppercase;color:var(--pc,var(--blue));margin-bottom:14px}
.eyebrow .rn{font:600 14px var(--mono);letter-spacing:.06em;color:var(--paper);background:var(--pc,var(--navy));padding:3px 8px 2px;border-radius:2px}
.eyebrow .pt{color:var(--rust);display:flex;align-items:center;gap:14px}
.eyebrow .pt:before{content:'';width:22px;height:1.5px;background:var(--rust)}
h1{font:600 84px/1.02 var(--serif);letter-spacing:-.02em;margin:0 0 28px}
h2{font:600 50px/1.08 var(--serif);letter-spacing:-.015em;margin:0;color:var(--ink)}
h3{font-size:26px;line-height:1.25;font-weight:650;margin:0 0 10px}
.body{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:safe center;gap:18px}
.foot{position:absolute;left:96px;right:96px;bottom:30px;display:grid;grid-template-columns:1fr 760px 1fr;align-items:end;gap:32px;font-size:14px;color:var(--footink)}
.foot .ttl{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:.01em}
.foot .n{font:500 15px var(--mono);text-align:right;letter-spacing:.04em}
.foot .n b{color:var(--ink2);font-weight:600}
.rail{display:flex;gap:6px}
.rail .seg{display:flex;flex-direction:column;gap:7px;min-width:0}
.rail .bar{height:3px;background:var(--rail);position:relative;border-radius:2px;overflow:hidden}
.rail .fill{position:absolute;left:0;top:0;bottom:0;background:var(--railon)}
.rail span{font:500 11px var(--sans);letter-spacing:.12em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--footink)}
.rail .on span{color:var(--railon);font-weight:700}

/* ---------- text ---------- */
p{font-size:26px;line-height:1.45;margin:0 0 10px}
ul,ol{margin:0 0 8px;padding-left:26px}
li{font-size:26px;line-height:1.42;margin:0 0 10px;padding-left:6px}
li::marker{color:var(--blue2);font-weight:600}
ol li::marker{color:var(--blue);font:600 .85em var(--mono)}
.small,.small p,.small li,p.small,li.small{font-size:22.5px;line-height:1.45}
.lead{font:400 32px/1.35 var(--serif)}
.muted{color:var(--muted)}
.mono{font-family:var(--mono)}
code.mono{font-size:.88em;background:var(--blue4);padding:1px 6px;border-radius:3px}
b,strong{font-weight:650}
.blue{color:var(--blue)}
.amber{color:var(--rust)}
.cap{font-size:18px;line-height:1.4;color:var(--muted);margin:8px 0 0}
.cols{display:grid;grid-template-columns:var(--c,1fr 1fr);gap:var(--g,56px);align-items:start;min-height:0}
.vstack{display:flex;flex-direction:column;gap:14px}
.lede{font:400 30px/1.4 var(--serif);color:var(--ink2)}

/* key takeaway and labelled boxes */
.key{flex:none;position:relative;margin-top:14px;padding:18px 0 0 46px;border-top:1px solid var(--line2);font:500 29px/1.36 var(--serif);color:var(--navy)}
.key:before{content:'→';position:absolute;left:4px;top:19px;font:500 26px var(--sans);color:var(--rust)}
.key b{font-weight:700}
.key .katex{font-weight:400}
.box{border-left:2px solid var(--blue2);padding:2px 0 2px 22px;margin:0 0 6px}
.box .lbl{display:block;font:700 13px var(--sans);letter-spacing:.15em;text-transform:uppercase;color:var(--blue);margin-bottom:8px}
.box p:last-child,.box ul:last-child{margin-bottom:2px}
.box.acc{border-left-color:var(--rust)}
.box.acc .lbl{color:var(--rust)}
.box.fill{border-left:none;background:var(--blue4);padding:16px 24px 14px;border-radius:3px}
.box.flat{border-left-color:var(--line2)}
.box.flat .lbl{color:var(--muted)}
.calc{border-left:2px solid var(--rust);padding:4px 0 4px 22px}
.calc p{margin:0 0 6px;font-size:21px;line-height:1.45}

/* math */
.tex.mb{display:block;font-size:28px;margin:8px 0 12px}
.tex.mb.big{font-size:40px}
.tex.mb.sm{font-size:24px}
.katex{font-size:1.06em}
.katex-display{margin:0;text-align:left}
.katex-display>.katex{text-align:left}

/* pseudocode */
.algo{font:22px/1.6 var(--mono);margin:0 0 12px;padding:6px 0}
.algo .ln{display:flex;padding-right:16px;white-space:pre}
.algo .no{flex:none;width:38px;color:var(--faint);user-select:none}
.algo .kw{color:var(--blue);font-weight:700}
.algo .cm{color:var(--faint)}

/* tables */
table.t{border-collapse:collapse;font-size:22px;line-height:1.3;font-variant-numeric:tabular-nums}
table.t th{text-align:left;font:600 13px var(--sans);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);border-bottom:1.5px solid var(--ink);padding:8px 14px}
table.t th .katex,.box .lbl .katex{text-transform:none;letter-spacing:0;font-size:1.25em}
table.t td{padding:8px 14px;border-bottom:1px solid var(--line);vertical-align:top}
table.t td:first-child,table.t th:first-child{padding-left:12px;border-left:3px solid transparent}
table.t tr:last-child td{border-bottom:1.5px solid var(--line2)}
table.t tr.cur td{background:var(--rustbg)}
table.t tr.cur td:first-child{border-left-color:var(--rust)}
table.t .r{text-align:right}
table.t td.r{font-family:var(--mono);font-size:.9em}
table.t.mono td{font-family:var(--mono);font-size:.9em}
table.t.sm{font-size:19.5px;line-height:1.28}
table.t.sm th{font-size:12px;padding:6px 10px}
table.t.sm td{padding:6px 10px}
table.wide{width:100%}

/* fragments */
[data-step],[data-only]{transition:opacity .25s ease}
.hidden{opacity:0;visibility:hidden}

/* svg figures */
svg.fig{display:block;overflow:visible;font-family:var(--sans)}
svg text{fill:var(--ink);font-size:20px}
svg .mono{font-family:var(--mono)}
svg .lbl{font-size:17px;fill:var(--muted)}
svg .lblb{font-size:18px;fill:var(--blue);font-weight:600}
svg .bold{font-weight:650}
svg .ln line,svg .ln path,svg line.ln,svg path.ln{stroke:var(--ink2);stroke-width:1.5;fill:none}
svg .ln polygon,svg polygon.ln{fill:var(--ink2)}
svg .lnA line,svg .lnA path,svg line.lnA,svg path.lnA{stroke:var(--rust);stroke-width:2.4;fill:none}
svg .lnA polygon,svg polygon.lnA{fill:var(--rust);stroke:none}
svg .lnB line,svg .lnB path,svg line.lnB,svg path.lnB{stroke:var(--blue2);stroke-width:2.2;fill:none}
svg .lnB polygon,svg polygon.lnB{fill:var(--blue2)}
svg .dash line,svg line.dash,svg path.dash,svg .dash path{stroke-dasharray:6 5}
svg .faint{stroke:var(--line);stroke-width:1}
svg .axis{stroke:var(--ink2);stroke-width:1.4}
svg .grid{stroke:var(--line);stroke-width:1}
svg .curve{fill:none;stroke:var(--blue);stroke-width:3;stroke-linejoin:round}
svg .curveA{fill:none;stroke:var(--rust);stroke-width:3}
svg .curveB{fill:none;stroke:var(--blue2);stroke-width:2.4;stroke-dasharray:7 6}
svg .dot{fill:var(--blue)}
svg .dotA{fill:var(--rust)}
svg .plain{fill:var(--paper2);stroke:var(--line2);stroke-width:1.3}
svg .ghost{fill:none;stroke:var(--faint);stroke-width:1.5;stroke-dasharray:5 4}
svg .node{fill:var(--paper2);stroke:var(--blue);stroke-width:2}
svg .nodeA{fill:var(--rustbg);stroke:var(--rust);stroke-width:2.2}
svg .band{fill:var(--blue4)}

/* title slide */
.slide.title{padding-top:84px}
.title .body{justify-content:flex-start;gap:0}
.title .kicker{font:600 15px var(--sans);letter-spacing:.18em;text-transform:uppercase;color:var(--blue);margin-bottom:34px;display:flex;gap:16px;align-items:center}
.title .kicker:after{content:'';width:80px;height:1.5px;background:var(--rust)}
.title h1{font-size:108px;line-height:.98;letter-spacing:-.025em;margin:0 0 30px;max-width:1300px}
.title h1 em{font-style:italic;color:var(--navy)}
.title .thesis{font:italic 400 32px/1.35 var(--serif);color:var(--ink2);max-width:1120px;margin:0}
/* title slide: the poll */
.title .thesis{font-style:normal;font-weight:500;color:var(--navy)}
.title .who{margin-top:auto;margin-bottom:18px;font-size:19px;color:var(--muted);letter-spacing:.02em}
.poll{display:grid;grid-template-columns:repeat(3,1fr);border-top:1.5px solid var(--ink)}
.poll>div{padding:20px 28px 0 0;display:flex;flex-direction:column;gap:12px}
.poll>div+div{padding-left:28px;border-left:1px solid var(--line2)}
.poll .w{font:600 32px/1.1 var(--serif)}
.poll .o{display:flex;gap:8px}
.poll .o span{font:500 14px var(--mono);color:var(--muted);border:1px solid var(--line2);padding:3px 11px;border-radius:2px}

/* chapter opener header */
.chap{display:flex;align-items:center;gap:22px;margin-bottom:16px;padding-bottom:14px;border-bottom:1px solid var(--line)}
.chap .cn{font:italic 600 58px/1 var(--serif);color:var(--pc);min-width:48px}
.chap .ct{display:flex;align-items:center;gap:14px;font:600 14px var(--sans);letter-spacing:.16em;text-transform:uppercase;color:var(--pc)}
.chap .cq{font:italic 400 25px var(--serif);color:var(--muted);margin-top:3px}
.qed{color:var(--rust);font-weight:700}

/* the three-question ledger */
.ledger{display:grid;grid-template-columns:repeat(3,1fr);border-top:1.5px solid var(--ink)}
.ledger .lg{padding:18px 26px 4px 0;display:flex;flex-direction:column;gap:8px}
.ledger .lg+.lg{padding-left:26px;border-left:1px solid var(--line2)}
.ledger .h{display:flex;align-items:baseline;gap:12px}
.ledger .rn{font:600 15px var(--mono);color:var(--c)}
.ledger .w{font:600 32px/1.1 var(--serif);color:var(--c)}
.ledger .qq{font:italic 400 23px/1.3 var(--serif);color:var(--ink2)}
.ledger .a{font-size:20px;line-height:1.45;color:var(--ink2)}
.ledger .a.todo{color:var(--faint);font:italic 400 19px var(--serif)}
.ledger .lg.now{background:linear-gradient(var(--c),var(--c)) top left/100% 4px no-repeat}
.ledger.mini{margin-top:4px}
.ledger.mini .lg{padding-top:12px;gap:4px}
.ledger.mini .w{font-size:21px}
.ledger.mini .rn{font-size:12px}
.ledger.mini .qq{display:none}
.ledger.mini .a{font-size:16.5px;line-height:1.4}
.ledger.mini .a.todo{font-size:16px}
.ledger.mini .lg:not(.now) .a:not(.todo){color:var(--muted)}

/* slide 2: an annotated statement */
.stmt{font:400 33px/1.5 var(--serif);border-left:3px solid var(--ink);padding:4px 0 4px 28px;margin:0 0 26px}
.stmt .q1,.stmt .q2,.stmt .q3{text-decoration:underline;text-decoration-thickness:3px;text-underline-offset:7px}
.stmt sup{font:700 13px var(--mono);margin-left:3px}
.q1{text-decoration-color:var(--blue)!important}.q1 sup{color:var(--blue)}
.q2{text-decoration-color:var(--rust)!important}.q2 sup{color:var(--rust)}
.q3{text-decoration-color:var(--teal)!important}.q3 sup{color:var(--teal)}
.legend{display:flex;flex-direction:column;gap:10px;padding-left:31px}
.legend>div{font-size:21px;color:var(--ink2);display:flex;gap:16px;align-items:baseline}
.legend b{font:700 14px var(--mono);color:var(--c);min-width:28px}
table.t th[scope],table.t tr>th:first-child:not(:only-child){}

/* slide 4: the season, day by day */
.days{display:grid;grid-template-columns:repeat(14,1fr);gap:6px;margin-top:6px}
.days .d{border:1px solid var(--line2);background:var(--paper2);padding:9px 0 11px;text-align:center}
.days .d i{display:block;font:500 12px var(--mono);font-style:normal;color:var(--faint);margin-bottom:3px}
.days .d b{font:600 18px var(--sans);color:var(--blue)}
.days .d.buy{border-color:var(--rust);background:var(--rustbg)}
.days .d.buy b{color:var(--rust)}
.days .d.unk{border-style:dashed;background:transparent}
.days .d.unk b{color:var(--faint)}

/* small trio variant (specifications) */
.trio.sm .f{font-size:24px;min-height:52px}
.trio.sm .rn{font-size:13px;line-height:1.4}
.trio.sm .q{font-size:21px}

/* tags for the three questions */
.tag{display:inline-block;font:700 12px var(--sans);letter-spacing:.12em;text-transform:uppercase;color:var(--c);border:1.5px solid var(--c);padding:2px 8px;border-radius:2px}
table.map td .tag{min-width:40px;text-align:center}
table.spec td[data-step]{color:var(--ink);font-weight:500}

/* figure classes added for the restructured deck */
svg .missc{fill:var(--teal)}
svg .hitc{fill:var(--tealbg)}
svg .lnT line,svg .lnT path{stroke:var(--teal);stroke-width:2;fill:none}
svg .lnT polygon{fill:var(--teal)}
svg .nodeT{fill:var(--tealbg);stroke:var(--teal);stroke-width:2}

/* closing: three answers */
.closing .kick{font:600 15px var(--mono);letter-spacing:.24em;text-transform:uppercase;color:var(--blue2);margin-bottom:30px}
.closing .ans{display:grid;grid-template-columns:230px 1fr;gap:22px 34px;margin:0;max-width:1300px}
.closing .ans dt{font:600 48px/1.05 var(--serif);color:#fff}
.closing .ans dd{margin:0;font-size:27px;line-height:1.42;color:#cdd6e6;padding-top:8px}
.slide.appx .eyebrow .rn{background:var(--muted)}

/* part dividers and closing (dark) */
.slide.divider,.slide.closing{background:var(--navy);color:#eef0f4;--rail:rgba(255,255,255,.16);--railon:#fff;--footink:rgba(255,255,255,.45)}
.slide.divider .foot .n b,.slide.closing .foot .n b{color:#fff}
.divider .body{justify-content:center;gap:0;align-items:flex-start;position:relative}
.divider .bignum{position:absolute;right:-30px;top:50%;transform:translateY(-54%);font:italic 600 560px/1 var(--serif);color:rgba(255,255,255,.055);pointer-events:none;letter-spacing:-.04em}
.divider .dnum{font:600 16px var(--mono);letter-spacing:.24em;text-transform:uppercase;color:var(--blue2);margin-bottom:22px}
.divider h1{font-size:76px;margin:0;color:#fff;max-width:1150px;position:relative}
.divider .rule{width:120px;height:3px;background:#e07a3f;margin:30px 0 26px}
.divider .sub{font:italic 400 34px/1.32 var(--serif);color:#cdd6e6;max-width:1100px}
.divider .dnote{font-size:21px;line-height:1.5;color:rgba(255,255,255,.62);margin-top:22px;max-width:1000px}
.divider .toc{display:flex;flex-wrap:wrap;gap:10px 34px;margin-top:44px;padding-top:20px;border-top:1px solid rgba(255,255,255,.16);max-width:1300px}
.divider .toc span{font-size:17px;color:rgba(255,255,255,.72)}
.divider .toc i{font:500 14px var(--mono);font-style:normal;color:#e07a3f;margin-right:9px}
.closing .body{justify-content:center;align-items:flex-start;gap:0}
.closing .from{font:italic 400 44px/1.2 var(--serif);color:rgba(255,255,255,.55);margin:0 0 6px}
.closing .from s{text-decoration-color:#e07a3f;text-decoration-thickness:2px}
.closing .to{font:600 76px/1.06 var(--serif);color:#fff;letter-spacing:-.02em;margin:0;max-width:1300px}
.closing .rule{width:120px;height:3px;background:#e07a3f;margin:40px 0 28px}
.closing .last{font:400 30px/1.4 var(--sans);color:#cdd6e6;max-width:1150px;margin:0}
.closing .last b{color:#fff}

/* big statements, cards, grids */
.trio{display:grid;grid-template-columns:repeat(3,1fr);gap:0;border-top:1.5px solid var(--ink)}
.trio>div{padding:22px 32px 6px 0;display:flex;flex-direction:column;gap:10px}
.trio>div+div{padding-left:32px;border-left:1px solid var(--line2)}
.trio .rn{font:600 15px var(--mono);color:var(--rust);letter-spacing:.1em}
.trio .w{font:600 46px/1.05 var(--serif)}
.trio .f{font-size:26px;min-height:44px;display:flex;align-items:center}
.trio .q{font:italic 400 24px/1.35 var(--serif);color:var(--muted)}
.trio .q b{font-style:normal;color:var(--navy);font-family:var(--sans);font-size:15px;letter-spacing:.14em;text-transform:uppercase;display:block;margin-bottom:4px}
.triple{display:flex;align-items:stretch;justify-content:center;gap:18px}
.triple .t{background:var(--navy);color:#fff;font:600 38px var(--serif);padding:18px 34px;display:flex;align-items:center;border-radius:2px}
.triple .t.acc{background:var(--rust)}
.qbig{font:600 52px/1.16 var(--serif);letter-spacing:-.015em;text-align:center;margin:0 auto 8px;max-width:1300px}
.caps{display:grid;grid-template-columns:repeat(3,1fr);gap:28px}
.caps .c{border-top:2px solid var(--navy);padding:18px 4px 4px;display:flex;flex-direction:column;gap:8px}
.caps .c .t{font:700 14px var(--sans);letter-spacing:.15em;text-transform:uppercase;color:var(--blue)}
.caps .c .v{font:600 32px/1.15 var(--serif)}
.caps .c .s{font-size:20px;color:var(--muted);line-height:1.4}
.caps4{display:grid;grid-template-columns:repeat(4,1fr);gap:26px}
.caps4 .c{border-top:2px solid var(--navy);padding:16px 2px 4px;display:flex;flex-direction:column;gap:8px}
.caps4 .c:last-child{border-top-color:var(--rust)}
.caps4 .c .t{font:700 13px var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--blue)}
.caps4 .c:last-child .t{color:var(--rust)}
.caps4 .c .v{font:600 29px/1.15 var(--serif)}
.caps4 .c .s{font-size:19px;color:var(--ink2);line-height:1.45}
.caps4 .c .s .tex.mb{margin:2px 0 10px}
.road{display:grid;grid-template-columns:repeat(3,1fr);gap:22px}
.road .c{background:var(--paper2);border:1px solid var(--line2);border-top:3px solid var(--navy);padding:20px 24px 22px;position:relative}
.road .c+.c:before{content:'→';position:absolute;left:-19px;top:30px;color:var(--blue2);font-size:20px}
.road .rn{font:600 14px var(--mono);color:var(--rust);letter-spacing:.1em}
.road .w{font:600 34px/1.15 var(--serif);margin:6px 0 10px}
.road .q{font-size:22px;color:var(--ink2);margin:0}
.road .s{font:italic 400 21px var(--serif);color:var(--muted);margin-top:6px}
.road-join{height:34px;margin:0 16.6%;border:1.5px solid var(--blue2);border-top:none;position:relative}
.road-join:before{content:'';position:absolute;left:50%;top:0;bottom:0;border-left:1.5px solid var(--blue2)}
.road-syn{background:var(--navy);color:#fff;padding:22px 30px;display:flex;align-items:baseline;gap:22px}
.road-syn .rn{font:600 14px var(--mono);color:#e07a3f;letter-spacing:.1em}
.road-syn .w{font:600 34px var(--serif)}

<body>
<div id="stage"><div id="deck"></div></div>
<div id="overview" role="dialog" aria-label="Slide overview"><div class="grid"></div></div>
<div id="notes" role="dialog" aria-label="Speaker notes"></div>
<script>
'use strict';
/* =====================================================================
   0. Assertions and small utilities
   ===================================================================== */
const failures = []; let checks = 0;
function check(ok, msg) { checks++; if (!ok) { failures.push(msg); console.error('Assertion failed: ' + msg); } }
const t = String.raw;
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
/* deterministic PRNG (mulberry32): every "random" run on the slides is reproducible */
function rng(seed) {
  return () => {
    seed = seed + 0x6D2B79F5 | 0;
    let x = Math.imul(seed ^ seed >>> 15, 1 | seed);
    x = x + Math.imul(x ^ x >>> 7, 61 | x) ^ x;
    return ((x ^ x >>> 14) >>> 0) / 4294967296;
  };
}
const lg = n => Math.ceil(Math.log2(n));

/* =====================================================================
   1. Computed content.
      Every number on the slides that can be checked is computed here and
      asserted, not typed in by hand. Model counts are labelled as such;
      nothing below is a hardware measurement.
   ===================================================================== */

/* ---------- 1.1 Sorting: what a textbook statement already fixes ---------- */
function mergeSortCount(a) {
  let cmp = 0;
  const ms = x => {
    if (x.length < 2) return x;
    const m = x.length >> 1, L = ms(x.slice(0, m)), R = ms(x.slice(m)), out = [];
    let i = 0, j = 0;
    while (i < L.length && j < R.length) { cmp++; out.push(L[i] <= R[j] ? L[i++] : R[j++]); }
    return out.concat(L.slice(i), R.slice(j));
  };
  return { s: ms(a), cmp };
}
const SORT_IN = [38, 27, 43, 3, 9, 82, 10, 55];
const SORT = mergeSortCount(SORT_IN);
const MS_WORST = n => n * lg(n) - 2 ** lg(n) + 1;
let FACT8 = 1; for (let i = 2; i <= 8; i++) FACT8 *= i;
const SORT_LB = Math.ceil(Math.log2(FACT8));
check(SORT.s.every((v, i) => i === 0 || SORT.s[i - 1] <= v), 'merge sort output is non-decreasing');
check([...SORT.s].join() === [...SORT_IN].sort((a, b) => a - b).join(), 'merge sort output is a permutation of the input');
check(MS_WORST(8) === 17, 'merge sort worst case for n = 8: n*ceil(lg n) - 2^ceil(lg n) + 1 = 17 comparisons');
check(SORT_LB === 16, 'any comparison sort needs ceil(log2 8!) = 16 comparisons in the worst case');
check(SORT.cmp <= MS_WORST(8) && SORT.cmp >= 1, 'this run stays within the proved worst case');

/* ---------- 1.2 Ski rental ---------- */
const SKI_B = 10;
function ski(n, b = SKI_B) {
  const alg = n < b ? n : (b - 1) + b;         // rent days 1..b-1, buy on day b if still needed
  const opt = Math.min(n, b);                  // knowing n: rent throughout, or buy on day 1
  return { alg, opt, ratio: alg / opt };
}
const SKI_ROWS = [3, 9, 10, 11, 25].map(n => ({ n, ...ski(n) }));
check(ski(3).alg === 3 && ski(3).ratio === 1, 'n = 3 < b: ALG = OPT = 3');
check(ski(10).alg === 19 && ski(10).opt === 10 && Math.abs(ski(10).ratio - 1.9) < 1e-12, 'n = b = 10: ALG 19 vs OPT 10');
check(ski(25).alg === 19 && ski(25).opt === 10, 'n = 25: still 19 vs 10');
{
  let ok = true;
  for (let b = 1; b <= 40; b++) {
    let worst = 0;
    for (let n = 1; n <= 200; n++) worst = Math.max(worst, ski(n, b).ratio);
    if (Math.abs(worst - (2 - 1 / b)) > 1e-12) ok = false;
  }
  check(ok, 'for b = 1..40 and n = 1..200 the worst ratio of break-even is exactly 2 - 1/b');
}
/* any deterministic strategy is "buy on the morning of day j" (or never);
   the adversary ends the season on day j */
const skiAdv = (j, b = SKI_B) => ((j - 1) + b) / Math.min(j, b);
const ADV_ROWS = [1, 5, 9, 10, 11, 20].map(j => ({ j, alg: j - 1 + SKI_B, opt: Math.min(j, SKI_B), r: skiAdv(j) }));
let ADV_MIN = Infinity, ADV_ARG = 0;
for (let j = 1; j <= 1000; j++) if (skiAdv(j) < ADV_MIN - 1e-12) { ADV_MIN = skiAdv(j); ADV_ARG = j; }
check(Math.abs(ADV_MIN - 1.9) < 1e-12 && ADV_ARG === 10, 'against the adversary, the best deterministic j is j = b, ratio 2 - 1/b');
const SKI_RAND = Math.E / (Math.E - 1);
check(Math.abs(SKI_RAND - 1.5819767068693265) < 1e-12, 'e/(e-1) = 1.582');

/* ---------- 1.3 Freivalds：枚举示例的全部 0/1 向量 ---------- */
const MAT_A = [[1,2],[3,4]], MAT_B = [[5,6],[7,8]];
const MAT_C = [[19,22],[43,50]], MAT_BAD = [[19,22],[43,51]];
const matVec = (M,x) => M.map(row => row.reduce((sum,v,j) => sum+v*x[j],0));
const matPass = (C,x) => matVec(MAT_A,matVec(MAT_B,x)).every((v,i) => v === matVec(C,x)[i]);
const MAT_X = [[0,0],[0,1],[1,0],[1,1]];
check(MAT_X.every(x => matPass(MAT_C,x)), 'correct product passes all four vectors');
check(MAT_X.filter(x => matPass(MAT_BAD,x)).length === 2, 'wrong product passes exactly half of the vectors');
check(!matPass(MAT_BAD,[0,1]) && matPass(MAT_BAD,[1,0]), 'worked examples detect and miss the error respectively');
check(2 ** -10 === 1/1024, 'ten independent rounds: false acceptance at most 1/1024');

/* ---------- 1.4 Approximation: the same epsilon, two promises ---------- */
const AP_N = 100000, AP_F = 1000, AP_EPS = 0.01;
const AP_ADD = AP_EPS * AP_N, AP_MUL = AP_EPS * AP_F;
check(AP_ADD === 1000 && AP_MUL === 10, 'eps = 1%: additive slack eps*N = 1000, multiplicative slack eps*f = 10');

/* ---------- 1.5 Bit lengths: what one "+" and one "x" cost in words ---------- */
const WORD = 64;
const BITROWS = [64, 256, 4096].map(L => ({ L, k: Math.ceil(L / WORD), add: Math.ceil(L / WORD), mul: Math.ceil(L / WORD) ** 2 }));
check(BITROWS[2].add === 64 && BITROWS[2].mul === 4096, 'L = 4096, w = 64: 64 words; schoolbook product 64^2 = 4096 word-pairs');
function squaringBits(k) { let bits = 2; for (let i = 0; i < k; i++) bits = 2 * bits - 1; return bits; }   // x = 2 is "10"
const SQROWS = [3, 10, 30].map(k => ({ k, bits: squaringBits(k) }));
check(SQROWS.every(r => r.bits === 2 ** r.k + 1), 'after k squarings of 2 the number has 2^k + 1 bits');
check(SQROWS[1].bits === 1025 && SQROWS[2].bits === 1073741825, 'k = 10: 1025 bits; k = 30: over a billion bits');

/* ---------- 1.6 Word-RAM bookkeeping ---------- */
const LOGROWS = [1e6, 1e9, 1e12].map(n => ({ n, b: lg(n) }));
check(LOGROWS.map(r => r.b).join() === '20,30,40', 'indices for 1e6, 1e9, 1e12 cells need 20, 30, 40 bits');
check(lg(2 ** 32) === 32 && (2 ** 32).toString(2).length === 33, 'n = 2^32: indices 0..n-1 fit in 32 bits, the value n itself needs 33');
const SUM_BITS = WORD + lg(1e9);
check(SUM_BITS === 94 && Math.ceil(SUM_BITS / WORD) === 2, 'exact sum of 1e9 64-bit numbers: at most 94 bits = 2 words');

/* ---------- 1.7 Block transfers: a scan, in two orders, in the block model ---------- */
function blockTrace(order, B, M) {               // LRU cache holding M blocks of B elements
  const cache = [], miss = [];
  for (const i of order) {
    const b = Math.floor(i / B), k = cache.indexOf(b);
    if (k >= 0) { cache.splice(k, 1); miss.push(false); } else { miss.push(true); if (cache.length === M) cache.shift(); }
    cache.push(b);
  }
  return { miss, loads: miss.filter(Boolean).length };
}
const BLK_N = 64, BLK_B = 8, BLK_M = 2;
const SEQ_ORDER = [...Array(BLK_N).keys()];
const RND_ORDER = (() => { const a = [...SEQ_ORDER], r = rng(7); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; })();
const BLK_SEQ = blockTrace(SEQ_ORDER, BLK_B, BLK_M), BLK_RND = blockTrace(RND_ORDER, BLK_B, BLK_M);
check(BLK_SEQ.loads === BLK_N / BLK_B, 'sequential scan of 64 elements, B = 8: exactly 8 block transfers');
check(BLK_RND.loads > 4 * BLK_SEQ.loads && BLK_RND.loads <= BLK_N, 'the same 64 elements in shuffled order: many more transfers, at most one per access');
const SC_N = 1e8, SC_B = 8;
check(Math.ceil(SC_N / SC_B) === 12500000, 'n = 1e8 eight-byte elements, 64-byte blocks (B = 8): 1.25e7 transfers for a scan');

/* ---------- 1.8 Work and span ---------- */
const span = { chain: n => n - 1, tree: n => lg(n) };
check(span.chain(8) === 7 && span.tree(8) === 3, 'n = 8: both shapes do 7 additions; span 7 (chain) vs 3 (tree)');
const PAR_N = 1e6, PAR_W = PAR_N - 1;
check(span.tree(PAR_N) === 20, 'tree summation of 1e6 values has span ceil(log2 1e6) = 20');
const PARROWS = [1, 10, 1000, 1e6].map(P => ({
  P, lo: Math.max(PAR_W / P, span.tree(PAR_N)), hi: PAR_W / P + span.tree(PAR_N), chain: Math.max(PAR_W / P, span.chain(PAR_N))
}));
check(Math.abs(PARROWS[2].hi - 1019.999) < 1e-9 && Math.abs(PARROWS[2].lo - 999.999) < 1e-9, 'tree, P = 1000: between 1000 and 1020 steps');
check(PARROWS.every(r => r.chain === PAR_W), 'chain: never fewer than 999,999 steps, whatever P is');

/* ---------- 1.9 The stream task: a counter is not free ---------- */
const CNT_MAX = 2 ** 32 - 1, CNT_RATE = 1e6;
const CNT_MIN = CNT_MAX / CNT_RATE / 60;
check(Math.abs(CNT_MIN - 71.58) < 0.01, 'a 32-bit counter at 1e6 items/s overflows after 71.6 minutes');

/* ---------- 1.10 Appendix material ---------- */
function euclid(a, b) { const tr = []; while (b !== 0) { tr.push({ a, b, r: a % b }); const nx = a % b; a = b; b = nx; } return { tr, g: a }; }
const EG = euclid(1071, 462);
check(EG.g === 21 && EG.tr.length === 3, 'Euclid(1071, 462) = 21 in 3 steps');
check(EG.tr.every(r => r.b > 0 && r.r < r.b), 'every step strictly descends: a mod b < b');

function binomTail(k, p) {                    // P[ Bin(k,p) < k/2 ]
  let s = 0;
  for (let i = 0; i <= Math.floor((k - 1) / 2); i++) {
    let c = 1; for (let j = 0; j < i; j++) c = c * (k - j) / (j + 1);
    s += c * Math.pow(p, i) * Math.pow(1 - p, k - i);
  }
  return s;
}

}

function lruRun(seq, k) {
  const c = [], miss = [];
  for (const x of seq) { const i = c.indexOf(x); if (i >= 0) { c.splice(i, 1); miss.push(false); } else { miss.push(true); if (c.length === k) c.shift(); } c.push(x); }
  return miss;
}
function optRun(seq, k) {                               // Belady: evict the page used farthest in the future
  const c = [], miss = [];
  seq.forEach((x, t) => {
    if (c.includes(x)) { miss.push(false); return; }
    miss.push(true);
    if (c.length === k) {
      const nextUse = y => { const j = seq.indexOf(y, t + 1); return j < 0 ? Infinity : j; };
      c.splice(c.indexOf(c.reduce((a, b) => nextUse(b) > nextUse(a) ? b : a)), 1);
    }
    c.push(x);
  });
  return miss;
}

add({ part: APPX, proof: true, title: '附 1 · 摊还：为什么总代价小于 3n', body: `
<div class="cols" style="--c:1fr 1fr;--g:56px">
 ${box('论证', `<p class="small">追加 ${mi('n')} 次。每次写入新元素：共 ${mi('n')} 次。扩容只在大小为 ${mi(t`1, 2, 4, \dots, 2^j`)}（${mi(t`2^j < n`)}）时发生，复制量之和</p>${md(t`1 + 2 + \cdots + 2^j = 2^{j+1} - 1 < 2n.`, 'sm')}<p class="small" style="margin:0">所以总代价 ${mi(t`< n + 2n = 3n`)}，平均每次 ${mi('< 3')}。<span class="qed">∎</span></p>`, 0, 'flat')}
 ${box('页面实算', `<p class="small" style="margin:0">${mi(t`n = 10^6`)}：复制 ${num(ARR.copies)} 次，写入共 ${num(ARR_N + ARR.copies)} 次，平均 ${ARR.avg.toFixed(3)}；最坏单次复制 ${num(ARR.worst)}。若每次只扩大固定的常数个位置，总代价会变成 ${mi(t`\Theta(n^2)`)}。</p>`, 0, 'acc')}
</div>`,
  notes: `【有人问时用】复制量是 1 + 2 + 4 + … ，几何级数，和不超过 2n；加上 n 次写入，总共不到 3n。如果每次只多开固定几个位置，总代价是平方级——“两倍”是关键。` });

add({ part: APPX, title: '附 2 · LRU 与“预知未来的最优”', body: `
<div class="cols" style="--c:1fr 1fr;--g:56px">
 ${box('结论（Sleator–Tarjan, 1985）', `<p class="small" style="margin:0">缓存大小为 ${mi('k')} 时，对任意请求序列 ${mi(t`\sigma`)}：${mi(t`\mathrm{LRU}(\sigma) \le k \cdot \mathrm{OPT}(\sigma) + k`)}；并且任何确定性在线策略都无法保证优于 ${mi('k')} 倍。</p>`, 0, 'fill')}
 ${box('直观', `<p class="small" style="margin:0">LRU 淘汰最久未用的项目；离线最优知道未来，淘汰最晚才再用的项目。比较时，两者使用相同容量的缓存。上面的界对所有请求序列成立；完整证明留给在线算法专题。</p>`, 0, 'flat')}

add({ part: APPX, proof: true, title: '附 3 · 错误乘积为什么至多一半会漏检？', body: `
<p class="scene">设 ${mi('D=AB-C\\ne 0')}。一轮漏检恰好是 ${mi('Dx=0')}；x 的每个坐标独立、等概率取 0 或 1。</p>
${box('固定其他坐标，只看一个随机比特', `<p>因为 D 非零，存在 ${mi(t`D_{ij}\ne0`)}。先固定除 ${mi('x_j')} 外的所有坐标，第 i 行的检查条件变为</p>${md(t`D_{ij}x_j+\sum_{k\ne j}D_{ik}x_k=0.`)}<p>第二项已经固定，而 ${mi('x_j')} 只有 0、1 两种等可能取值。系数 ${mi(t`D_{ij}\ne0`)}，所以两种取值至多有一种让等式成立。</p>`)}
${key(`因此 ${mi(t`\Pr[Dx=0]\le\Pr[(Dx)_i=0]\le1/2`)}。对固定的错误输入，独立重复 t 轮、全部通过的概率至多 ${mi(t`(1/2)^t`)}；若 D=0，每轮必定通过。`)}
<p class="cap">结论基于精确算术；时间按算术操作次数计数。大整数的位运算成本需另计。</p>`,
notes: `【有人问时用】选 D 的一个非零元素，固定其他随机坐标，只留下一个随机比特。零或一至多有一个能抵消那一行的固定和，所以漏检概率至多一半。各轮独立，漏检概率相乘。` });

 <div>

/* =====================================================================
   5. Render, navigation, overview, notes, print
   ===================================================================== */
const N = slides.length;
const MAIN = slides.filter(s => s.part < APPX).length;
const ranges = MAIN_PARTS.map(p => { const idx = slides.map((s, i) => s.part === p ? i : -1).filter(i => i >= 0); return { start: idx[0], end: idx[idx.length - 1] + 1 }; });
check(MAIN === 16 && PNO === 11, 'the main path has 16 slides, eleven of them concrete problems');
const MINUTES = MAIN_PARTS.map(p => slides.filter(s => s.part === p).reduce((a, s) => a + (s.min || 0), 0));
check(MINUTES.reduce((a, b) => a + b, 0) === 43, 'time budget adds up to 43 min');
let appx = 0;
slides.forEach((s, i) => {
  s.no = s.part < APPX ? String(i + 1).padStart(2, '0') : '附' + (++appx);
  s.end = s.part < APPX ? slides.slice(0, i + 1).reduce((a, x) => a + (x.min || 0), 0) : null;
});
const zhHTML = s => (s.notes || '').split('\n').map(l => `<p>${esc(l).replace(/【([^】]*)】/g, '<span class="cue">【$1】</span>')}</p>`).join('');
function railHTML(i) {
  return `<div class="rail">${MAIN_PARTS.map(p => {
    const r = ranges[p], f = Math.max(0, Math.min(1, (i - r.start + 1) / (r.end - r.start)));
    return `<div class="seg${slides[i].part === p ? ' on' : ''}" style="flex:${r.end - r.start}"><div class="bar"><div class="fill" style="width:${(f * 100).toFixed(1)}%"></div></div><span>${PARTS[p]}</span></div>`;
  }).join('')}</div>`;
}
function headHTML(s) {
  const tag = s.proof ? '<span class="pt">证明</span>' : '';
  const pn = s.pno ? `问题 ${s.pno} / 11` : '';
  if (s.opener) return `<header><div class="chap"><span class="cn">${ROMAN[s.part]}</span><div><div class="ct">第${GROUP[s.part]}组 · ${PARTS[s.part]}<span class="pn">${pn}</span></div><div class="cq">${PART_Q[s.part]}</div></div></div><h2>${esc(s.title)}</h2></header>`;
  const eb = s.pno ? `<span class="rn">${s.pno} / 11</span>${PARTS[s.part]}` : `${ROMAN[s.part] ? `<span class="rn">${ROMAN[s.part]}</span>` : ''}${PARTS[s.part]}`;
  return `<header><div class="eyebrow">${eb}${tag}</div><h2>${esc(s.title)}</h2></header>`;
}
const bare = s => s.cls === 'title' || s.cls === 'divider' || s.cls === 'closing';
document.getElementById('deck').innerHTML = slides.map((s, i) => `
<section class="slide ${s.cls || ''}${s.part === APPX ? ' appx' : ''}${s.pno ? ' pslide' : ''}" style="--pc:${PART_C[s.part]}" data-index="${i}" aria-label="第 ${s.no} 页：${esc(s.title)}">
 ${bare(s) ? '' : headHTML(s)}
 <div class="body">${s.body}</div>
 <aside class="notes">${esc(s.notes || '')}</aside>
 <div class="foot"><span class="ttl">${i === 0 ? '→ 下一页 · ← 上一页 · O 总览 · N 讲稿' : '现代算法讨论班 · 开场'}</span>${railHTML(i)}<span class="n"><b>${s.no}</b>${s.part < APPX ? ' / ' + MAIN : ''}</span></div>
</section>`).join('');



const sections = [...document.querySelectorAll('#deck .slide')];
const nums = v => String(v).trim().split(/\s+/).map(Number);
function maxStep(sec) { let m = 0; sec.querySelectorAll('[data-step],[data-only]').forEach(n => { ['step', 'only'].forEach(k => { if (n.dataset[k]) m = Math.max(m, ...nums(n.dataset[k])); }); }); return m; }
function applyStep(sec, k) {
  sec.querySelectorAll('[data-step]').forEach(n => n.classList.toggle('hidden', +n.dataset.step > k));
  sec.querySelectorAll('[data-only]').forEach(n => n.classList.toggle('hidden', !nums(n.dataset.only).includes(k)));
}
const STEPS = sections.map(sec => { const m = maxStep(sec); sec.querySelectorAll('[data-only]').forEach(n => { if (nums(n.dataset.only).includes(m)) n.classList.add('last-only'); }); return m; });
let index = 0, stepIx = 0;
const clock = m => `${Math.floor(m)}:${m % 1 ? '30' : '00'}`;
function show() {
  sections.forEach((sec, i) => sec.classList.toggle('active', i === index));
  applyStep(sections[index], stepIx);
  const s = slides[index];
  document.getElementById('notes').innerHTML = `<h4>${s.no}${s.part < APPX ? ' / ' + MAIN : ''} · 步骤 ${stepIx} / ${STEPS[index]}${s.min ? ` · 本页 ${s.min} 分钟 · 讲完时约 ${clock(s.end)}` : ''} · ${esc(s.title)}</h4><div class="zh">${zhHTML(s)}</div>`;
  document.querySelectorAll('#overview .card').forEach((c, i) => c.classList.toggle('on', i === index));
  history.replaceState(null, '', `#${index + 1}.${stepIx}`);
}
function next() { if (stepIx < STEPS[index]) stepIx++; else if (index < N - 1) { index++; stepIx = 0; } show(); }
function prev() { if (stepIx > 0) stepIx--; else if (index > 0) { index--; stepIx = STEPS[index]; } show(); }
function go(i, k = 0) { index = Math.max(0, Math.min(N - 1, i)); stepIx = Math.max(0, Math.min(STEPS[index], k)); show(); }

function buildOverview() {
  const grid = document.querySelector('#overview .grid'); if (grid.children.length) return;
  sections.forEach((sec, i) => {
    const card = document.createElement('div'); card.className = 'card';
    const thumb = document.createElement('div'); thumb.className = 'thumb';
    const clone = sec.cloneNode(true); clone.classList.add('active'); applyStep(clone, STEPS[i]);
    thumb.appendChild(clone); card.appendChild(thumb);
    card.insertAdjacentHTML('beforeend', `<div class="meta"><span class="mono">${slides[i].no}</span> · ${PARTS[slides[i].part]}${slides[i].proof ? ' · proof' : ''} · <b>${esc(slides[i].title)}</b></div>`);
    card.onclick = () => { go(i); toggleOverview(false); };
    grid.appendChild(card);
  });
  show();
}
function toggleOverview(force) { const o = document.getElementById('overview'), open = force ?? !o.classList.contains('open'); if (open) buildOverview(); o.classList.toggle('open', open); }
function toggleNotes() { document.getElementById('notes').classList.toggle('open'); }
document.addEventListener('keydown', e => {
  if (e.altKey || e.ctrlKey || e.metaKey) return;
  const k = e.key;
  if (k === 'o' || k === 'O') { e.preventDefault(); toggleOverview(); return; }
  if (k === 'n' || k === 'N') { e.preventDefault(); toggleNotes(); return; }
  if (k === 'Escape') { toggleOverview(false); document.getElementById('notes').classList.remove('open'); return; }
  if (document.getElementById('overview').classList.contains('open')) return;
  if (k === 'ArrowRight' || k === ' ' || k === 'PageDown' || k === 'ArrowDown') { e.preventDefault(); next(); }
  else if (k === 'ArrowLeft' || k === 'PageUp' || k === 'ArrowUp') { e.preventDefault(); prev(); }
  else if (k === 'Home') { e.preventDefault(); go(0); }
  else if (k === 'End') { e.preventDefault(); go(MAIN - 1); }
});
document.getElementById('deck').addEventListener('click', e => {
  if (e.target.closest('a')) return;
  const r = e.currentTarget.getBoundingClientRect();

function fit() { document.getElementById('deck').style.transform = `scale(${Math.min(innerWidth / 1600, innerHeight / 900)})`; }
addEventListener('resize', fit); fit();
function printState(on) {
  sections.forEach((sec, i) => applyStep(sec, on ? STEPS[i] : (i === index ? stepIx : 0)));

}
addEventListener('beforeprint', () => printState(true));
addEventListener('afterprint', () => printState(false));
matchMedia('print').addEventListener?.('change', e => printState(e.matches));

function renderMath() {
  if (!window.katex) return false;

    try { katex.render(el.dataset.tex, el, { displayMode: el.dataset.display === '1', throwOnError: true, output: 'html' }); }
    catch (err) { console.error('KaTeX failed on: ' + el.dataset.tex + ' — ' + err.message); failures.push('KaTeX: ' + el.dataset.tex); }
    el.removeAttribute('data-tex');
  });
  return true;
}
sections.forEach((sec, i) => applyStep(sec, STEPS[i]));
{ const m = location.hash.match(/^#(\d+)(?:\.(\d+))?$/); if (m) go(+m[1] - 1, +(m[2] || 0)); else go(0); }
addEventListener('DOMContentLoaded', () => renderMath());
addEventListener('load', () => { renderMath(); window.deckReady = true; });
window.deck = { checks: () => checks, failures, N, MAIN, STEPS, go, next, prev, applyStep, sections, state: () => ({ index, step: stepIx }) };
console.info(`开场讲座（概览 + 十一个问题）: ${checks} assertions checked, ${failures.length} failed; ${MAIN} main + ${N - MAIN} appendix slides; ${MINUTES.join(' / ')} min.`);
