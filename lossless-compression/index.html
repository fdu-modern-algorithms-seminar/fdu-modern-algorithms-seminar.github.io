/* =====================================================================
   5. Render, navigation, overview, notes, print
   ===================================================================== */
const N = slides.length;
const ranges = PARTS.map((_, p) => { const idx = slides.map((s, i) => s.part === p ? i : -1).filter(i => i >= 0); return { start: idx[0], end: idx[idx.length - 1] + 1 }; });
function progressHTML(i) {
  return `<div class="progress">${PARTS.map((name, p) => { const r = ranges[p], f = Math.max(0, Math.min(1, (i - r.start + 1) / (r.end - r.start))); return `<div class="seg${slides[i].part === p ? ' on' : ''}" style="flex:${r.end - r.start}"><div class="bar"><div class="fill" style="width:${(f * 100).toFixed(1)}%"></div></div><span>${name}</span></div>`; }).join('')}</div>`;
}
document.getElementById('deck').innerHTML = slides.map((s, i) => `
<section class="slide ${s.cls || ''}" data-index="${i}" aria-label="第 ${i + 1} 页：${esc(s.title)}">
 ${progressHTML(i)}
 ${s.cls === 'title' ? '' : `<header><div class="eyerow"><div class="eyebrow">第 ${ROMAN[s.part]} 部分 · ${PARTS[s.part]}${s.proof ? ' <span class="pt">· 证明</span>' : ''}</div>${s.chip ? `<div class="chip">${CHIP}</div>` : ''}</div><h2>${esc(s.title)}</h2></header>`}
 <div class="body">${s.body}</div>
 <aside class="notes">${esc(s.notes || '')}</aside>
 <div class="foot"><span>${i === 0 ? '→ / 空格：下一步 · ←：后退 · O：总览 · N：备注 · Ctrl+P：打印' : '压缩：从 Kraft 到 ANS 再到语言模型'}</span><span class="n">${i + 1} / ${N}</span></div>
</section>`).join('');

const sections = [...document.querySelectorAll('#deck .slide')];
const nums = v => String(v).trim().split(/\s+/).map(Number);
function maxStep(sec) { let m = 0; sec.querySelectorAll('[data-step],[data-only],[data-cur]').forEach(n => { ['step', 'only', 'cur'].forEach(k => { if (n.dataset[k]) m = Math.max(m, ...nums(n.dataset[k])); }); }); return m; }
function applyStep(sec, k) {
  sec.querySelectorAll('[data-step]').forEach(n => n.classList.toggle('hidden', +n.dataset.step > k));
  sec.querySelectorAll('[data-only]').forEach(n => n.classList.toggle('hidden', !nums(n.dataset.only).includes(k)));
  sec.querySelectorAll('[data-cur]').forEach(n => n.classList.toggle('cur', nums(n.dataset.cur).includes(k)));
}
const STEPS = sections.map(sec => { const m = maxStep(sec); sec.dataset.steps = m; sec.querySelectorAll('[data-only]').forEach(n => { if (nums(n.dataset.only).includes(m)) n.classList.add('last-only'); }); return m; });
let index = 0, stepIx = 0;
function show() {
  sections.forEach((sec, i) => sec.classList.toggle('active', i === index));
  applyStep(sections[index], stepIx);
  const notes = document.getElementById('notes');
  notes.innerHTML = `<h4>第 ${index + 1} / ${N} 页 · 第 ${stepIx} / ${STEPS[index]} 步 · ${esc(slides[index].title)}</h4>${esc(slides[index].notes || '')}`;
  document.querySelectorAll('#overview .card').forEach((c, i) => c.classList.toggle('on', i === index));
  history.replaceState(null, '', `#${index + 1}.${stepIx}`);
}
function next() { if (stepIx < STEPS[index]) stepIx++; else if (index < N - 1) { index++; stepIx = 0; } show(); }
function prev() { if (stepIx > 0) stepIx--; else if (index > 0) { index--; stepIx = STEPS[index]; } show(); }
function go(i, k = 0) { index = Math.max(0, Math.min(N - 1, i)); stepIx = Math.max(0, Math.min(STEPS[index], k)); show(); }

function buildOverview() {
  const grid = document.querySelector('#overview .grid'); if (grid.children.length) return;
  sections.forEach((sec, i) => {
    const card = document.createElement('div'); card.className = 'card';
    const thumb = document.createElement('div'); thumb.className = 'thumb';
    const clone = sec.cloneNode(true); clone.classList.add('active'); applyStep(clone, STEPS[i]); clone.querySelectorAll('.cur').forEach(n => n.classList.remove('cur'));
    thumb.appendChild(clone); card.appendChild(thumb);
    card.insertAdjacentHTML('beforeend', `<div class="meta"><span class="mono">${String(i + 1).padStart(2, '0')}</span> · ${PARTS[slides[i].part]}${slides[i].proof ? ' · 证明' : ''} · <b>${esc(slides[i].title)}</b></div>`);
    card.onclick = () => { go(i); toggleOverview(false); };
    grid.appendChild(card);
  });
  show();
}
function toggleOverview(force) { const o = document.getElementById('overview'), open = force ?? !o.classList.contains('open'); if (open) buildOverview(); o.classList.toggle('open', open); }
function toggleNotes() { document.getElementById('notes').classList.toggle('open'); }
document.addEventListener('keydown', e => {
  if (e.altKey || e.ctrlKey || e.metaKey) return;
  const k = e.key;
  if (k === 'o' || k === 'O') { e.preventDefault(); toggleOverview(); return; }
  if (k === 'n' || k === 'N') { e.preventDefault(); toggleNotes(); return; }
  if (k === 'Escape') { toggleOverview(false); document.getElementById('notes').classList.remove('open'); return; }
  if (document.getElementById('overview').classList.contains('open')) return;
  if (k === 'ArrowRight' || k === ' ' || k === 'PageDown' || k === 'ArrowDown') { e.preventDefault(); next(); }
  else if (k === 'ArrowLeft' || k === 'PageUp' || k === 'ArrowUp') { e.preventDefault(); prev(); }
  else if (k === 'Home') { e.preventDefault(); go(0); }
  else if (k === 'End') { e.preventDefault(); go(N - 1); }
});
document.getElementById('deck').addEventListener('click', e => {
  if (e.target.closest('a')) return;
  const r = e.currentTarget.getBoundingClientRect();
  (e.clientX - r.left) > r.width * 0.3 ? next() : prev();
});
function fit() { document.getElementById('deck').style.transform = `scale(${Math.min(innerWidth / 1600, innerHeight / 900)})`; }
addEventListener('resize', fit); fit();
// print: every slide at its final step, no "current step" highlight
function printState(on) {
  sections.forEach((sec, i) => { applyStep(sec, on ? STEPS[i] : (i === index ? stepIx : 0)); if (on) sec.querySelectorAll('.cur').forEach(n => n.classList.remove('cur')); });
  if (!on) show();
}
addEventListener('beforeprint', () => printState(true));
addEventListener('afterprint', () => printState(false));
matchMedia('print').addEventListener?.('change', e => printState(e.matches));

function renderMath() {
  if (!window.katex) return false;
  document.querySelectorAll('.tex[data-tex]').forEach(el => {
    try { katex.render(el.dataset.tex, el, { displayMode: el.dataset.display === '1', throwOnError: true, output: 'html' }); }
    catch (err) { console.error('KaTeX failed on: ' + el.dataset.tex + ' — ' + err.message); failures.push('KaTeX: ' + el.dataset.tex); }
    el.removeAttribute('data-tex');
  });
  return true;
}
sections.forEach((sec, i) => applyStep(sec, STEPS[i]));
{ const m = location.hash.match(/^#(\d+)(?:\.(\d+))?$/); if (m) go(+m[1] - 1, +(m[2] || 0)); else go(0); }
addEventListener('DOMContentLoaded', () => renderMath());
addEventListener('load', () => { renderMath(); window.deckReady = true; });
window.deck = { checks: () => checks, failures, N, STEPS, go, next, prev, applyStep, sections, state: () => ({ index, step: stepIx }) };
console.info(`Compression deck: ${checks} assertions checked, ${failures.length} failed; ${N} slides, ${STEPS.reduce((a, b) => a + b, 0)} fragment steps.`);
</script>
