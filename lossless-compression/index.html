<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>压缩：从 Kraft 到 ANS 再到语言模型</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.22/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.22/dist/katex.min.js"></script>
<style>
:root{
  --bg:#FAFAF7; --ink:#15181d; --muted:#5b626c; --faint:#8b919a; --line:#dcdfd8;
  --blue:#1d3f7c; --blue2:#8ea7cd; --blue3:#d9e2f0; --blue4:#edf1f7;
  --amber:#d48a00; --amberbg:#fcefcf; --code:#f0f0ea;
  --sa:#d9e2f0; --sb:#8ea7cd; --sc:#1d3f7c;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{overflow:hidden;background:#ececE6;color:var(--ink);font-family:Inter,"PingFang SC","Microsoft YaHei","Noto Sans SC","Noto Sans CJK SC","Source Han Sans SC",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
a{color:var(--blue);text-decoration:none}
#stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
#deck{position:relative;width:1600px;height:900px;flex:none;background:var(--bg);overflow:hidden;transform-origin:center center}

/* ---------- slide frame ---------- */
.slide{position:absolute;inset:0;padding:86px 80px 72px;display:none;flex-direction:column}
.slide.active{display:flex}
.progress{position:absolute;top:26px;left:80px;right:80px;display:flex;gap:8px}
.progress .seg{display:flex;flex-direction:column;gap:7px;min-width:0}
.progress .bar{height:4px;background:var(--line);position:relative}
.progress .fill{position:absolute;left:0;top:0;bottom:0;background:var(--blue)}
.progress span{font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint)}
.progress .on span{color:var(--blue);font-weight:700}
.slide>header{flex:none;margin-bottom:24px}
.eyerow{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;min-height:26px}
.eyebrow{font-size:15px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--blue)}
.chip{font:500 15px 'JetBrains Mono',monospace;color:var(--muted);border:1px solid var(--line);padding:3px 12px;white-space:nowrap}
h1{font-size:76px;line-height:1.04;letter-spacing:-.035em;font-weight:700;margin:0 0 30px}
h2{font-size:44px;line-height:1.12;letter-spacing:-.025em;font-weight:650;margin:0}
h3{font-size:27px;line-height:1.25;font-weight:650;margin:0 0 10px;letter-spacing:-.01em}
.body{flex:1;min-height:0;display:flex;flex-direction:column;gap:18px}
.foot{position:absolute;left:80px;right:80px;bottom:24px;display:flex;justify-content:space-between;font-size:14px;color:var(--faint)}
.foot .n{font-family:'JetBrains Mono',monospace;font-size:15px}

/* ---------- text ---------- */
p{font-size:27px;line-height:1.42;margin:0 0 12px}
ul,ol{margin:0 0 10px;padding-left:28px}
li{font-size:27px;line-height:1.4;margin:0 0 12px;padding-left:4px}
li::marker{color:var(--blue);font-weight:600}
.small,.small p,.small li,p.small,li.small{font-size:23px;line-height:1.42}
.lead{font-size:30px;line-height:1.35}
.muted{color:var(--muted)}
.mono{font-family:'JetBrains Mono',monospace}
b,strong{font-weight:650}
.blue{color:var(--blue)}
.cap{font-size:18px;line-height:1.35;color:var(--muted);margin:8px 0 0}
.cols{display:grid;grid-template-columns:var(--c,1fr 1fr);gap:var(--g,56px);align-items:start;min-height:0}
.vstack{display:flex;flex-direction:column;gap:14px}
.stack{display:grid}
.stack>*{grid-area:1/1}
.num{display:inline-block;width:32px;height:32px;line-height:32px;text-align:center;border-radius:50%;background:var(--blue);color:#fff;font-size:18px;font-weight:700;margin-right:10px;vertical-align:2px}

/* key takeaway, theorem boxes */
.key{margin-top:auto;background:var(--blue4);border-left:6px solid var(--blue);padding:16px 26px;font-size:28px;line-height:1.35;font-weight:600;flex:none}
.key .katex{font-weight:400}
.box{border:1.5px solid var(--blue);padding:14px 22px 10px;margin:0 0 14px;background:#fff}
.box .lbl{display:block;font-size:14px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--blue);margin-bottom:6px}
.box p:last-child{margin-bottom:4px}
.callout{background:var(--amberbg);border-left:6px solid var(--amber);padding:10px 18px;font-size:23px;line-height:1.4;margin:0}
.calc{border-left:6px solid var(--amber);background:var(--amberbg);padding:10px 18px}
.calc p{margin:0 0 4px;font-size:23px}

/* formal environments */
.env{border-left:5px solid var(--blue);background:#fff;padding:9px 20px 7px;margin:0 0 12px;font-size:24px;line-height:1.42}
.env.definition{border-left-color:var(--blue2)}
.env .eh{font-weight:700;color:var(--blue);margin-right:3px}
.env .en{font-weight:600}
.env .tex.mb{margin:6px 0 4px}
.proof,.remark{font-size:22px;line-height:1.45;margin:0 0 12px;padding:0 4px 0 8px}
.proof .ph,.remark .ph{font-style:italic;font-weight:700;margin-right:3px}
.proof .qed{float:right;color:var(--blue);margin-left:14px}
.proof .tex.mb{font-size:25px;margin:6px 0}
.proof ol.psteps{margin:6px 0 0;padding-left:28px}
.proof ol.psteps li{font-size:22px;line-height:1.45;margin:0 0 6px}
.ref{font-weight:600;color:var(--blue);white-space:nowrap}
.eyebrow .pt{color:var(--muted)}

/* math */
.tex.mb{display:block;font-size:29px;margin:8px 0 12px}
.tex.mb.big{font-size:36px}
.tex.mb.sm{font-size:25px}
.katex{font-size:1.06em}
.katex-display{margin:0;text-align:left}
.katex-display>.katex{text-align:left}

/* pseudocode */
.algo{background:var(--code);padding:10px 0 12px;font:21px/1.5 'JetBrains Mono',monospace;margin:0 0 14px;width:fit-content;min-width:100%}
.algo .ttl{font:700 14px Inter,"PingFang SC","Microsoft YaHei","Noto Sans SC",sans-serif;letter-spacing:.12em;text-transform:uppercase;color:var(--blue);padding:2px 20px 8px}
.algo .ln{display:flex;border-left:5px solid transparent;padding-right:16px;white-space:pre}
.algo .no{flex:none;width:44px;text-align:right;padding-right:14px;color:var(--faint);user-select:none}
.algo .kw{color:var(--blue);font-weight:700}
.algo .fn{font-weight:700}
.algo .cm{color:var(--faint)}
.algo .ln.cur{background:var(--amberbg);border-left-color:var(--amber)}

/* tables */
table.t{border-collapse:collapse;font-size:23px;line-height:1.3}
table.t th{text-align:left;font-weight:650;color:var(--blue);border-bottom:2px solid var(--ink);padding:7px 14px;font-size:19px}
table.t td{padding:7px 14px;border-bottom:1px solid var(--line);vertical-align:top}
table.t td:first-child,table.t th:first-child{border-left:5px solid transparent}
table.t tr.cur td{background:var(--amberbg)}
table.t tr.cur td:first-child{border-left-color:var(--amber)}
table.t td.cur{background:var(--amberbg);outline:3px solid var(--amber);outline-offset:-3px}
table.t .r{text-align:right}
table.t.tight th,table.t.tight td{padding:7px 9px}
table.t.mono td{font-family:'JetBrains Mono',monospace}
table.wide{width:100%}
.sym{display:inline-block;min-width:26px;padding:0 6px;text-align:center;font-family:'JetBrains Mono',monospace;font-weight:700}
.sym.a{background:var(--sa)}.sym.b{background:var(--sb)}.sym.c{background:var(--sc);color:#fff}

/* fragments */
[data-step],[data-only]{transition:opacity .22s ease}
.hidden{opacity:0;visibility:hidden}

/* svg figures */
svg.fig{display:block;overflow:visible;font-family:Inter,sans-serif}
svg text{fill:var(--ink);font-size:20px}
svg .mono{font-family:'JetBrains Mono',monospace}
svg .lbl{font-size:17px;fill:var(--muted)}
svg .lblb{font-size:18px;fill:var(--blue);font-weight:600}
svg .bold{font-weight:700}
svg .on-dark{fill:#fff}
svg .ln line,svg .ln path,svg line.ln,svg path.ln{stroke:var(--ink);stroke-width:1.5;fill:none}
svg .ln polygon{fill:var(--ink)}
svg .dash line,svg line.dash,svg path.dash,svg .dash path{stroke-dasharray:6 5}
svg .faint{stroke:var(--line);stroke-width:1}
svg .axis{stroke:var(--ink);stroke-width:1.5}
svg .grid{stroke:var(--line);stroke-width:1}
svg .curve{fill:none;stroke:var(--blue);stroke-width:3}
svg .curve2{fill:none;stroke:var(--ink);stroke-width:2;stroke-dasharray:7 6}
svg .curveL{fill:none;stroke:var(--blue2);stroke-width:3}
svg .curve3{fill:none;stroke:var(--blue2);stroke-width:2.2;stroke-dasharray:7 6}
svg .dot{fill:var(--blue)}
svg .sa{fill:var(--sa)} svg .sb{fill:var(--sb)} svg .sc{fill:var(--sc)}
svg .cell{stroke:var(--bg);stroke-width:2}
svg .plain{fill:#fff;stroke:var(--ink);stroke-width:1.2}
svg .ghost{fill:none;stroke:var(--faint);stroke-width:1.5;stroke-dasharray:5 4}
svg .edge{stroke:var(--blue);stroke-width:2.2}
svg .node{fill:var(--bg);stroke:var(--blue);stroke-width:2.2}
svg .cur.cell,svg .cur.hl,svg .node.cur{stroke:var(--amber);stroke-width:5}
svg .edge.cur{stroke:var(--amber);stroke-width:6}
svg .plain.cur{fill:var(--amberbg)}
svg .rowbg{fill:transparent}
svg .rowbg.cur{fill:var(--amberbg)}
svg text.cur{fill:var(--amber);font-weight:700}
svg .barb{fill:var(--blue)} svg .barl{fill:var(--blue2)}

/* pipeline diagram */
.pipe{display:flex;align-items:center;gap:0;margin:6px 0 0}
.pipe .pn{font:500 24px 'JetBrains Mono',monospace;white-space:nowrap}
.pipe .pa{width:64px;height:2px;background:var(--ink);position:relative;margin:0 10px;flex:none}
.pipe .pa:after{content:'';position:absolute;right:-2px;top:-6px;border-left:12px solid var(--ink);border-top:7px solid transparent;border-bottom:7px solid transparent}
.pipe .pa i{position:absolute;left:50%;top:-34px;transform:translateX(-50%);font-style:normal;font-size:22px}
.pipe .pb{border:2px solid var(--blue);padding:12px 22px;text-align:center;background:#fff;min-width:200px}
.pipe .pb b{display:block;font-size:15px;letter-spacing:.14em;text-transform:uppercase;color:var(--blue);margin-bottom:4px}
.pipe .pb .v{font-size:23px}
.pipe .pb small{display:block;font-size:16px;color:var(--muted);margin-top:4px}
.pipe .pb.hot{background:var(--blue);color:#fff}
.pipe .pb.hot b,.pipe .pb.hot small{color:#fff}
.pipe .pb.dim{border-color:var(--line)}
.pipe.large .pn{font-size:30px}.pipe.large .pb{padding:16px 30px;min-width:260px}.pipe.large .pb .v{font-size:28px}.pipe.large .pb small{font-size:18px}.pipe.large .pa{width:84px}.pipe.large .pa i{font-size:26px;top:-40px}
.pipe.small .pn{font-size:19px}.pipe.small .pb{min-width:0;padding:10px 14px}.pipe.small .pb .v{font-size:19px}.pipe.small .pa{width:38px;margin:0 8px}

/* title slide */
.title .partmap{display:grid;grid-template-columns:repeat(4,1fr);gap:28px;border-top:1px solid var(--line);padding-top:22px;margin-top:auto}
.title .partmap b{display:block;font-size:22px;color:var(--blue);margin-bottom:6px}
.title .partmap span{font-size:19px;color:var(--muted)}
.thesis{font-size:36px;font-weight:650;color:var(--blue);letter-spacing:-.015em;margin:34px 0 0}
.hint{font:14px 'JetBrains Mono',monospace;color:var(--faint)}

/* figures from papers */
.paper{background:#fff;border:1px solid var(--line);padding:10px;display:block}
.paper img{display:block;width:100%;height:auto}

/* discussion & references */
.qs{counter-reset:q}
.qs .q{border-bottom:1px solid var(--line);padding:20px 0 16px;display:grid;grid-template-columns:80px 1fr}
.qs .q:before{counter-increment:q;content:'0' counter(q);font:500 24px 'JetBrains Mono',monospace;color:var(--blue);padding-top:4px}
.qs .q p{font-size:33px;font-weight:600;margin:0 0 6px;letter-spacing:-.01em}
.qs .q span{font-size:21px;color:var(--muted);line-height:1.4}
.refs{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px 40px}
.refs h3{font-size:15px;letter-spacing:.12em;text-transform:uppercase;color:var(--blue);margin:0 0 8px}
.refs p{font-size:19px;line-height:1.38;margin:0 0 12px}

/* overlays */
#notes{display:none;position:fixed;left:3%;right:3%;bottom:2%;max-height:42vh;overflow:auto;background:#fff;border:2px solid var(--blue);padding:18px 26px;z-index:40;font-size:19px;line-height:1.65}
#notes.open{display:block}
#notes h4{margin:0 0 8px;color:var(--blue);font-size:16px}
#overview{display:none;position:fixed;inset:0;background:var(--bg);overflow:auto;z-index:30;padding:28px 36px}
#overview.open{display:block}
#overview .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:22px}
#overview .card{cursor:pointer;border:1px solid var(--line);background:#fff}
#overview .card.on{outline:3px solid var(--blue)}
#overview .thumb{width:320px;height:180px;overflow:hidden;position:relative;margin:4px auto 0}
#overview .thumb .slide{transform:scale(.2);transform-origin:0 0;width:1600px;height:900px;background:var(--bg);pointer-events:none}
#overview .meta{font-size:13px;padding:6px 10px;color:var(--muted)}
#overview .meta b{color:var(--ink);font-weight:600}
aside.notes{display:none}

@media print{
  @page{size:1600px 900px;margin:0}
  html,body{height:auto;overflow:visible;background:var(--bg);-webkit-print-color-adjust:exact;print-color-adjust:exact}
  #stage{position:static;display:block}
  #deck{transform:none!important;width:1600px;height:auto;overflow:visible}
  .slide{position:relative;display:flex!important;width:1600px;height:900px;break-after:page;page-break-after:always;overflow:hidden}
  .slide:last-child{break-after:auto;page-break-after:auto}
  .hidden{opacity:1!important;visibility:visible!important}
  [data-only]:not(.last-only){opacity:0!important;visibility:hidden!important}
  #notes,#overview{display:none!important}
}
.proof .ph,.remark .ph{font-style:normal}
.nb{white-space:nowrap}

<script>
'use strict';
/* =====================================================================
   0. Assertions
   ===================================================================== */
const failures = []; let checks = 0;
function check(ok, msg) { checks++; if (!ok) { failures.push(msg); console.error('Assertion failed: ' + msg); } }
const t = String.raw;
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const log2 = Math.log2;
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let r = Math.imul(a ^ a >>> 15, 1 | a); r = r + Math.imul(r ^ r >>> 7, 61 | r) ^ r; return ((r ^ r >>> 14) >>> 0) / 4294967296; }; }

/* =====================================================================
   1. The running distribution of Part II: a = 1/2, b = 1/4, c = 1/4
   ===================================================================== */
const SYM = ['a', 'b', 'c'];
const F = { a: 2, b: 1, c: 1 };          // frequencies, sum = M
const CUM = { a: 0, b: 2, c: 3 };        // cumulative frequencies
const M = 4;
const prob = s => F[s] / M;
const slotSym = r => SYM.find(s => r >= CUM[s] && r < CUM[s] + F[s]);
check(SYM.map(s => F[s]).join() === '2,1,1' && SYM.map(s => CUM[s]).join() === '0,2,3', 'running distribution M=4, f=[2,1,1], c=[0,2,3]');
const H = ps => ps.reduce((h, p) => p > 0 ? h - p * log2(p) : h, 0);
const hb = p => H([p, 1 - p]);

/* ---------- Huffman (stable tie-break: earlier item goes left = bit 0) ---------- */
function huffman(items) {
  let id = 0;
  let q = items.map(it => ({ s: it.s, w: it.w, id: id++ }));
  const merges = [];
  while (q.length > 1) {
    q.sort((x, y) => x.w - y.w || x.id - y.id);
    const x = q.shift(), y = q.shift();
    const n = { w: x.w + y.w, id: id++, left: x, right: y };
    merges.push({ x, y, n });
    q.push(n);
  }
  const codes = {};
  (function walk(n, c) { if (n.s) codes[n.s] = c || '0'; else { walk(n.left, c + '0'); walk(n.right, c + '1'); } })(q[0], '');
  return { root: q[0], codes, merges };
}

/* formal environments, numbered per part (Theorem 2.5 = 5th statement of Part II).
   env/ref emit placeholders; add() numbers them in document order and resolves references. */
const PENDING = [], LABELS = {}, PART_N = [0, 0, 0, 0];
const KIND_ZH = { Theorem: '定理', Lemma: '引理', Proposition: '命题', Corollary: '推论', Definition: '定义' };
function env(kind, name, body, o = {}) {
  const zk = KIND_ZH[kind] || kind;
  const id = PENDING.push({ kind: zk, label: o.label }) - 1;
  return `<div class="env ${kind.toLowerCase()}"${o.k ? ` data-step="${o.k}"` : ''}><span class="eh">${zk} ⟦E${id}⟧${name ? `<span class="en">（${name}）</span>` : ''}</span>&ensp;${body}</div>`;
}
const ref = l => `⟦R:${l}⟧`;
function add(o) {
  o.body = o.body.replace(/⟦E(\d+)⟧/g, (_, id) => {
    const e = PENDING[id], num = `${o.part + 1}.${++PART_N[o.part]}`;
    if (e.label) LABELS[e.label] = `${e.kind} ${num}`;
    return num;
  }).replace(/⟦R:(\w+)⟧/g, (_, l) => { if (!LABELS[l]) { check(false, 'undefined reference: ' + l); return '??'; } return `<span class="ref">${LABELS[l]}</span>`; });
  slides.push(o);
}

const NOTES_ZH = ["整讲骨架就是这张图：压缩 = 建模（给出 p）+ 编码（按 p 付 log 1/p 比特）。Part I 讲任何算法都打不破的下界；Part II 讲编码器如何逼近下界——Huffman 带过，重点是算术编码和 ANS；Part III 讲 p 从哪来（在线计数）；Part IV 讲深度模型：LLM 是最强的 p，VAE 把数据压成噪声。标题栏带“证明”的页是证明页，时间不够可以只讲定理陈述。操作：→/空格 前进（先走完片段），← 后退，O 总览，N 备注，Ctrl+P 打印。", "先问：能不能写一个让所有文件都变小的程序？定理：无损 = 单射，n 位串 2^n 个，比 n 短的串（含空串）只有 2^n−1 个，鸽笼。推论：能压缩至少 k 位的输入不到 2^{n−k+1} 个，占比 < 2^{1−k}；省 10 位最多 1/512 的文件。所以压缩器本质上是在赌输入分布——这就是“模型”，也是全讲主线的起点。", "形式化定义：码、唯一可译（拼接是单射）、前缀码。引理：前缀码唯一可译——放到 trie 的叶子上，沿输入往下走，第一个碰到的叶子是唯一可能的前缀，所以第一个符号被确定，对剩余部分归纳；演示 100110 → b a c a。右边引理：码字 u 对应二进区间 I_u（以 u 开头的实数），前缀关系 = 区间包含，否则不相交。图中叶子的横向范围就是它的区间。这条引理在 Kraft 逆定理和算术编码的证明里会被引用。", "Kraft 不等式的证明分两步。第一步：把树补到公共深度 D，深度 ℓ 的码字在第 D 层恰有 2^{D−ℓ} 个后代（右图虚线）。第二步：前缀性 ⇒ 不同码字的后代集合互不相交，第 D 层一共 2^D 个节点，所以和 ≤ 2^D，除以 2^D。本例 2+1+1 = 4 = 2^2，恰好用满（完全树）。直觉：码长 ℓ 花掉 2^{-ℓ} 的预算。", "逆定理：长度满足 Kraft 就能构造前缀码。按长度排序，第 i 个码字取“已用预算 S_i”的 ℓ_i 位二进制（因为前面的 2^{-ℓ_j} 都是 2^{-ℓ_i} 的倍数，所以展开恰好 ℓ_i 位）；对应区间首尾相接、互不相交，由上一页的区间引理，互不为前缀。右表：码长 1,2,2 → 0, 10, 11，区间恰好铺满 [0,1)。这就是 DEFLATE 的 canonical Huffman：只传码长。和 Kraft 合起来：前缀码存在 ⇔ Σ2^{-ℓ} ≤ 1。下一页问：放宽到唯一可译码能不能更短？", "两个定义一个引理。熵 = 期望惊讶度；表里四个例子：公平硬币 1 位，运行例子 1.5 位（Part II 一直用它），极偏硬币 0.081 位，均匀字节 8 位。相对熵（KL 散度）这里允许 q 是次概率（总和 ≤ 1），这样下一页可以直接把 2^{-ℓ} 当作 q。Gibbs 不等式：log 是严格凹函数，Jensen 给出 −D ≤ log Σq ≤ 0；取等当且仅当 q = p。", "定理陈述后分两半证明。下界：任何前缀码，令 q = 2^{-ℓ}，由 Kraft 它是次概率；L − H 恰好等于 D(p‖q) ≥ 0（Gibbs）。取等当且仅当 p(x) = 2^{-ℓ_x}（二进概率）。上界：Shannon 码长 ⌈log 1/p⌉ 满足 Kraft，由逆定理存在前缀码，每个码长比理想值多不到 1。推论：分块编码把取整损失摊到 1/n。类比 OI：比较排序下界 log2 n! 也是信息论下界——随机排列的熵。核心结论：x 的理想码长是 log 1/p(x)。", "你们都会 Huffman，只花两分钟。伪代码就是堆上反复合并最小的两个；右图由代码实时计算：先合并 b、c 得 1/2，再合并 a 与 (bc)。码字 a=0、b=10、c=11，平均码长 1.5 = H，因为概率都是 2 的负幂，源编码定理的下界取等。下一页是最优性证明（可跳过）。", "（可选证明页。）引理 1 交换：最优树里每个内部节点都有两个孩子，所以最深的叶子 u 有兄弟叶子 v；把概率最小的 x 换到 u 的位置，L 的变化 (p_x − p_u)(d_u − d_x) ≤ 0。引理 2 合并：兄弟叶子合并成一个叶子，L 恰好减少 p_x + p_y。定理：对字母表大小归纳。任意树 T 都可以假设 x、y 是兄弟，于是 L(T) = L(T') + p_x + p_y ≥ L(T'_H) + p_x + p_y = L(T_H)。", "命题：二元源的任何前缀码平均码长至少 1（两个码字都非空），所以冗余至少 1 − h(p)，p→1 时趋于 1 位。极偏分布 (0.99, 0.01) 熵 0.081 位，浪费 0.919 位、约熵的 11 倍。推论：分块到 k 个符号，冗余 < 1/k，但码表 m^k 指数膨胀。出路：不要逐符号付费——把整条消息编码成一个数：算术编码。", "算术编码：维护区间 [low, low+width)，每读一个符号就按模型概率把区间切开、取对应子区间。引理（不变量）：宽度 = 消息概率 P，且同长度的不同消息区间互不相交——对 n 归纳，每一步把区间切成首尾相接的几段。解码器反过来：看接收到的数落在哪一段，这一步需要一次除法。关键：编码器每步只需要 p(s | 过去)，模型可以任意换（自适应、上下文、神经网络）——模型/编码器分离，Part III/IV 都建立在这上面。", "用精确分数逐步计算（代码里用 BigInt 分数，不是手写）。读 b：[0,1) → [1/2, 3/4)；读 a：取前一半 → [1/2, 5/8)；读 c：取最后四分之一 → [19/32, 5/8)。宽度 1/32 = 5 位 = 2+1+2，正好是理想信息量。本例最终区间恰好是二进区间，所以输出 10011 五位即可（一般情况见下一页的定理：< log 1/P + 2）。代价：两个耦合状态变量和进位、有限精度需要逐位规格化、解码每符号要一次除法——慢。这就是 ANS 要解决的问题。", "（证明页。）引理：任何宽度 w 的区间都包含一个宽度 2^{-k} 的对齐二进区间，k = ⌈log 1/w⌉ + 1：因为 2^{-k} ≤ w/2，取 j = ⌈a·2^k⌉ 即可。定理：码长 k < log 1/P + 2；前缀性来自两条引理——每个码字的区间在自己消息的区间里，不同消息的区间不相交，所以码字区间互不包含，于是互不为前缀。消息长度 n 需要解码器已知（或用结束符）。与 Huffman 对比：+2 是整条消息的开销，不是每符号 +1。", "ANS 的入口非常 OI：十进制数就是一个栈。末尾追加数字 = push（x → 10x+d），取末位 = pop。每 push 一位，log2 x 增加 log2 10 ≈ 3.32 位，恰好是均匀数字（p=1/10）的信息量。想让符号 s 花 log 1/p_s 位，就要让它把 x 放大约 1/p_s 倍——“进制”随符号变化，所以叫非对称数系。注意它天生是栈：后进先出。", "rANS 的核心直觉：按 y mod 4 给所有非负整数染色（a a b c 循环）。编码 s 就是“跳到颜色 s 的第 x 个整数”（从 0 数）。b 从 4 出发：b 色整数 2,6,10,14,18 → 第 4 个是 18。a 从 18 出发：a 色第 18 个是 36。然后形式化：定义 I_s 和 C(s,x)；引理：C(s,·) 恰好按增序枚举 I_s——I_s 的元素是 qM + c_s + r，按 (q,r) 字典序递增，下标 x = q f_s + r。I_s 的密度是 p_s，所以第 x 个大约在 x/p_s 处——正是我们想要的放大倍数。", "把引理写成代码。编码：x = q·f + r，把 q 放大成 q·M，r 放进 s 的槽位区间。推论：各 I_s 划分 ℕ，C(s,·) 是到 I_s 的双射，所以每个整数 y 恰好对应一对 (s,x)；解码：y mod M 落在哪个槽位区间就是哪个符号（查一张大小为 M 的表），y div M 还原 q，再把 r 拼回来。M 取 2 的幂时，解码只有与运算、查表、一次乘加——没有除法。编码侧除以 f[s] 实际实现里可用预计算倒数乘法代替。", "逐步 trace（全部由 JS 计算）：b：4·⌊4/1⌋+2+0 = 18，18 mod 4 = 2 → b；a：4·⌊18/2⌋+0+0 = 36，36 mod 4 = 0 → a；c：4·36+3+0 = 147，147 mod 4 = 3 → c。左上槽位条高亮当前槽，下方 log2 条每步增长约 log 1/p（虚线是理想累计 2、3、5）。总共 log2(147/4) ≈ 5.20 位，比理想 5 位多 0.2 位——因为 x 很小，下一页的定理给出精确误差界。", "直觉先行：理想情况下编码一个符号就是 x → x/p_s，log2 x 恰好增加 log2(1/p_s) 位；但 rANS 的状态必须是整数，所以问题只是“取整损失多少”。引理：C(s,x) 离理想值 x/p_s 不到 M。定理：只要 x ≥ 2Mp_s，每个符号多花（或少花）的比特 ε 不超过 (2/ln2)·Mp_s/x。推论：把每一步加起来，状态里存的比特 = 理想信息量 + 各步误差之和。右表用上一页的 trace 验算（全部由 JS 计算）：b 的理想值 16、实际 18，差 2；a 恰好 36，差 0；c 理想 144、实际 147，差 3——都小于 M=4。误差 ε 分别是 0.170、0、0.030 位，都在界内，而且界随 x 变大而变小。结论：x 必须保持很大——但又不能无限长大：这就是后面的重整化。证明放在下一页，时间不够可跳过。", "（证明页，可跳过。）引理证明三步：把 x 写成 q·f_s + r；C = qM + c_s + r，理想值 x/p_s = qM + rM/f_s；相减得 c_s − r(M/f_s − 1)。第一项在 [0, M−f_s]，第二项在 [0, M)（因为 r < f_s），所以差在 (−M, M−f_s] 内，严格小于 M（代码里对所有 x<5000 断言过）。定理证明三步：把 C 写成理想值乘 (1+u)，ε 就是 log2(1+u)；由引理 |u| < Mp_s/x ≤ 1/2；再用 |ln(1+u)| ≤ 2|u|（|u| ≤ 1/2 时成立）得到 |ε| ≤ (2/ln2)·Mp_s/x。推论：log2(x_n/x_0) 拆成每一步的 log2(x_i/x_{i−1}) 之和，每项用定理。", "解码 147：147 mod 4 = 3 → c，x = 1·36+3−3 = 36；36 mod 4 = 0 → a，x = 2·9+0−0 = 18；18 mod 4 = 2 → b，x = 1·4+2−2 = 4。得到 c, a, b：与编码顺序相反（栈）。由解码推论，D 撤销的是最后一次 C。修正：倒序编码 c, a, b（4 → 19 → 37 → 150），解码 150 得到 b, a, c。工程处理：如果模型是自适应的，先正向跑模型、把每步概率存下来，再对一个块倒序编码。这是 ANS 相对算术编码的主要代价：需要分块缓冲。", "x 不能无限增长，所以维持不变量 L ≤ x < bL：编码前先把低位数字（实践中是字节）吐到输出流，直到 x 小于 x_max = (L/M)·b·f_s，再做 C(s,x)，结果正好回到 [L, bL)。解码相反：先 D(x)，x 掉到 L 以下就从流里读回数字（倒序读）。玩具：按比特 b=2、L=M=4，状态只有 4..7。编码 b,a,c：4 吐 00 → 1 → 6；6 吐 0 → 3 → 5；5 吐 10 → 1 → 7。共 5 位，正好等于理想值（二进概率）。实际参数：32 位状态，L = 2^23，按字节输出（ryg_rans 的选择）。", "（证明页。）引理 1：C(s,x) = Mq + (c+r)，L 和 bL 都是 M 的倍数，所以 C ∈ [L,bL) ⟺ L/M ≤ q < bL/M ⟺ x ∈ [A_s, bA_s)，这就是 x_max = b·A_s 的来历。引理 2：初值 x ≥ L ≥ A_s，每次除以 b 不会掉到 A_s 以下，所以移位循环一定落在 [A_s, bA_s)。定理：编码前状态 x0，吐了 k 个数字；解码得到 ⌊x0/b^k⌋，读回 j<k 个数字时状态 ⌊x0/b^{k−j}⌋ ≤ x0/b < L，继续读；读满 k 个恰好回到 x0 ≥ L 停止——读写数字一一对应。推论：重整化保证 x ≥ A_s，所以每符号误差 ≤ (2/ln2)·M/L，L = 2^16 M 时小于 5e−5 位。", "关键观察（命题）：当 L = M、按比特输出时，不变量 L ≤ x < 2L 说明状态只有 M 个（这里 4..7），每个 (状态, 符号) 的“输出几位、跳到哪个状态”都可以预先算好——就是一个有限自动机，编码就是查表走路径（琥珀色是 b,a,c 的路径）。这就是 tANS（table ANS）。本例概率二进，所以每个符号输出位数固定；一般情况下同一符号在不同状态输出 ⌊log 1/p⌋ 或 ⌈log 1/p⌉ 位，状态记住了“分数比特”——这正是 Huffman 做不到的。", "", "为什么 ANS 在工业界取代了算术编码：单一整数状态；解码无除法；多个独立状态可以交错写入同一个流（Giesen 2014），充分利用 CPU 流水线/SIMD/GPU；压缩率接近 AC、速度接近 Huffman（Duda 论文标题就是这个）。实际部署：zstd（序列头用 tANS/FSE、字面量用 Huffman）、Apple LZFSE、JPEG XL、基因组 CRAM 格式。Duda 2009 年首次提出，2013-14 年的版本影响最大，他有意不申请专利。", "总结对比，每一格都对应前面的定理。压缩损失：Huffman 每符号最多近 1 位；AC 整条消息 < 2 位；流式 ANS 每符号 ≤ (2/ln2)M/L 加上最后状态。速度：Huffman 和 tANS 都是查表；AC 解码需要除法和串行更新。状态：AC 两个变量加进位，ANS 一个整数。顺序：ANS 是栈。适用：概率每个符号都在变（上下文混合、LLM 压缩）时 AC 最自然；块内静态概率（zstd、JPEG XL）时 ANS 最快。结论：给定 p，编码问题已经解决——下一部分问 p 从哪里来。", "主线回归：编码器解决了，剩下的只有模型。命题：用模型 q 编码真实分布 p 的数据，期望码长 = H(p) + KL(p‖q)；证明一行：log 1/q = log 1/p + log p/q 取期望。H(p) 不可避免，KL 是模型错误的代价——所有压缩算法的竞争都在这一项上。本部分讲最经典的 q：在线计数；Part IV 讲神经网络。", "最简单的模型：在线计数。预测 → 编码（付 log 1/q 位）→ 更新计数；解码器看到同样的前缀，所以能同步维护同样的计数，不需要传参数。α=1 是 Laplace，α=½ 是 KT。定义 regret：与“事后最好的固定分布”比较多花的比特数——在线学习里 log loss 下的 regret。右图由代码实时算出：Laplace 与 KT 的 regret 及各自上界（对每个前缀都做了断言）。下一页证明 Laplace 的上界。", "（证明页，三步。）第一步望远镜：符号第 k+1 次出现时分子是 k+1，t 时刻分母是 t+1，所以概率乘积 = n0! n1! / (T+1)! = 1/((T+1)·C(T,n1))（代码里数值验证过这个恒等式）。第二步：最好的固定硬币的似然乘以 C(T,n1) 是二项分布的一项，≤ 1。第三步相除：regret ≤ log2(T+1)。备注：KT（α=½）改进到 ½ log T + 1；K 个符号时 (K−1)/2 log T + O(1)，是最优的。每符号冗余 → 0。这里连接本讨论班的在线学习专题。", "", "桥梁，两个方向都形式化：命题 1（预测 ⇒ 压缩）：链式法则把序列概率拆成逐个预测的乘积，再用算术编码定理，码长 < Σ log 1/p + 2。命题 2（压缩 ⇒ 预测）：由 Kraft，任何前缀码的 2^{-ℓ} 是次概率，从而定义条件预测。交叉熵训练损失（nats）乘 n 除以 ln2 就是比特数。LLM 之前就有证据：PPM、上下文混合 PAQ、Hutter Prize（压缩维基百科，解压器大小也计入）。结论：训练语言模型 = 最小化训练数据的压缩长度。", "设定：把预训练语言模型冻结，只做 in-context 预测，接精确算术编码器，得到无损压缩器（正是上一页的命题 1）。数据各 1GB：enwik9 文本；ImageNet 取 32×64 灰度块，每字节一个像素；LibriSpeech 16kHz 语音。都切成 2048 字节一段（模型上下文长度限制）。基线：gzip、LZMA2（通用），PNG、FLAC（专用）。指标：压缩后大小/原始大小。模型几乎只在文本上训练过。", "头条结果（摘要中的数字）：Chinchilla 70B 把 ImageNet 图块压到 43.4%（PNG 58.5%），把 LibriSpeech 压到 16.4%（FLAC 30.3%）。注意论文 Table 1 在 2048 字节分块设定下给的是 48.0% 和 21.0%，排序结论不变；我们不猜测差异原因，只如实标注。重点：模型几乎没见过图像/音频，靠上下文学习适应。但这里没有计入模型本身的大小——下一页的转折。", "转折：把模型参数（float16，每参数 2 字节）也算进压缩结果——两部分码 / MDL。Table 1：在 1GB 的 enwik9 上，gzip 程序只有几 KB，原始率 = 调整率；Chinchilla 70B 原始率 8.3%，调整后 14008%——140GB 的模型远大于 1GB 数据。Figure 2（论文原图）：在 enwik7/8/9 上训练不同大小的 Transformer，调整压缩率随模型变大先降后升，每个数据量都有最优模型大小，数据越大能负担的参数越多。", "反方向：压缩器也是生成模型（Part IV 第一页命题 2 的实例）。对每个可能的下一个字节 b，算追加后码长增加了多少，ρ̂(b|x) ∝ 2^{ℓ(x) − ℓ(xb)}，归一化后采样（论文 §3.4 公式）。gzip 生成的图像续写噪声很大，Chinchilla 好得多。分词也是压缩：BPE 本质上是字典编码。权衡：token 越长，上下文能装下更多字节，但预测字母表更大更难。Table 2：200K 参数的小模型 BPE 20K 最好（19.3%）；38M 模型 ASCII 最好（6.4%）。最佳分词器依赖模型规模。", "第二篇：Huang 等，COLM 2024。31 个开源基座模型、12 个基准、三个领域。压缩效率用 BPC（定义：总比特数除以字符数，不是 token 数，所以不同分词器可比），在模型训练截止后新收集的语料（2023 年的 Common Crawl、GitHub Python、arXiv 数学论文）上计算。结果（论文原图 Figure 1）：分数与 BPC 近乎线性，Pearson 相关系数：总体 −0.931，知识 −0.935，代码 −0.937，数学 −0.953。负号：BPC 越低（压缩越好），分数越高。", "需要谨慎的地方。(1) 相关不是因果：规模、数据、训练配方同时影响 BPC 和分数。(2) 基准可以被“刷”：Figure 4（论文原图）里 Qwen 系列被 MIN-K% PROB 方法判定为可能过拟合基准，落在直线上方，作者把它们排除在拟合之外——这本身说明直线会被破坏。(3) 语料必须和能力领域匹配：用 Common Crawl 的 BPC 预测数学，或用 GitHub 的 BPC 预测知识，相关性明显变弱（§4.2）。(4) “智能”在这里只是 12 个基准的平均分，对象是配方相近的基座模型。结论：压缩是一个便宜、无需标注的代理指标，但只在同类模型和匹配领域内有效。", "每题约两分钟。1：两部分码 vs. 预装模型；Hutter Prize 计入解压器大小，Delétang 的 raw rate 不计入；共享解码器（浏览器内置字典、预装 LLM）的成本如何分摊？2：同一领域、同类模型内相关很强；但跨领域、被刷基准时会失效；预测文本 ≠ 能行动、能规划。", "参考文献页。所有算法图（Huffman、算术编码、rANS、流式 rANS、tANS、Laplace/KT）都在页面加载时由 JS 计算生成并断言，控制台会打印断言数量和失败数；定理、引理按全片统一编号，交叉引用自动生成。论文图为原图裁剪（Delétang Fig. 2、Huang Fig. 1 与 Fig. 4），柱状图为按论文数字重绘。"];

add({ part: 0, title: '没有程序能压缩所有文件', body: `
<div class="cols" style="--c:1fr 540px">
 <div>
  ${env('Theorem', '不存在万能压缩器', `设 ${mi(t`C:\{0,1\}^*\to\{0,1\}^*`)} 是单射。则对每个 <span class="nb">${mi(t`n\ge 1`)}，</span>存在某个 ${mi(t`x\in\{0,1\}^n`)} 使 <span class="nb">${mi(t`|C(x)|\ge n`)}。</span>`, { label: 'pigeon' })}
  ${proof(`长度为 ${mi('n')} 的输入有 ${mi('2^n')} 个，而比 ${mi('n')} 短的串只有 ${mi(t`\sum_{j=0}^{n-1}2^j=2^n-1`)} 个；单射不可能把前者全部放进后者。`, { k: 1 })}
  ${env('Corollary', '', `长度为 ${mi('n')} 的输入中，满足 ${mi(t`|C(x)|\le n-k`)} 的不到 ${mi(t`2^{\,n-k+1}`)} 个，占比 <span class="nb">${mi(t`<2^{1-k}`)}。</span>想省 10 比特，最多 1/512 的文件能做到。`, { k: 2 })}
  ${proof(`长度 ${mi(t`\le n-k`)} 的串共有 ${mi(t`\sum_{j=0}^{n-k}2^j=2^{n-k+1}-1`)} 个；除以 ${mi('2^n')} 即可。`, { k: 2 })}
 </div>
 <div>${pigeonFig()}</div>
</div>
${key('压缩是一场押注：可能的输入用短码，其余的用长码。判断什么是“可能的”，就是模型。', 3)}`,
notes: NOTES_ZH[1] });

add({ part: 0, title: '码、唯一可译性与前缀码', body: `
<div class="cols" style="--c:1fr 640px;--g:44px">
 <div>
  ${env('Definition', '码', `<b>码</b>给每个符号分配一个码字 <span class="nb">${mi(t`c(x)\in\{0,1\}^*`)}；</span>消息按拼接 ${mi(t`c(x_1)c(x_2)\cdots`)} 编码。若拼接是单射，称该码<b>唯一可译</b>；若没有码字是另一个码字的前缀，称为<b>前缀码</b>。`)}
  ${env('Lemma', '', `每个前缀码都唯一可译，并且可以从左到右贪心解码，无需向前看。`, { label: 'pfud', k: 1 })}
  ${proof(`把码字放在二叉 trie 的叶子上；前缀码意味着没有叶子是另一个叶子的祖先。沿着输入从根往下走，遇到的第一个叶子是输入<i>唯一</i>可能的前缀码字，所以第一个符号被确定。对剩余部分归纳。`, { k: 1 })}
  ${step(2, decodeDemo())}
 </div>
 <div>
  ${treeFig()}
  ${env('Lemma', '码字即区间', `令 ${mi(t`I_u=[0.u,\;0.u+2^{-|u|})`)}（二进制展开以 ${mi('u')} 开头的实数）。则 ${mi('u')} 是 ${mi('v')} 的前缀当且仅当 <span class="nb">${mi(t`I_v\subseteq I_u`)}；</span>否则 <span class="nb">${mi(t`I_u\cap I_v=\varnothing`)}。</span>`, { label: 'dyadic', k: 3 })}
 </div>
</div>`,
notes: NOTES_ZH[2] });

add({ part: 0, proof: true, title: 'Kraft 不等式', body: `
<div class="cols" style="--c:1fr 640px;--g:44px">
 <div>
  ${env('Theorem', 'Kraft 1949', `若一个前缀码的码长为 <span class="nb">${mi(t`\ell_1,\dots,\ell_m`)}，</span>则 ${md(t`\sum_{i=1}^{m} 2^{-\ell_i}\;\le\;1.`)}`, { label: 'kraft' })}
  ${proof(`令 <span class="nb">${mi(t`D=\max_i\ell_i`)}；</span>把码字看作深度为 ${mi('D')} 的满二叉树中的节点。
   <ol class="psteps">
    ${step(1, `第 ${mi('i')} 个码字位于深度 <span class="nb">${mi(t`\ell_i`)}，</span>在深度 ${mi('D')} 上恰有 ${mi(t`2^{D-\ell_i}`)} 个后代。`, 'li')}
    ${step(2, `前缀码 ⇒ 没有码字是另一个码字的祖先 ⇒ 这些后代集合是深度 ${mi('D')} 上 ${mi('2^D')} 个节点的两两不交的子集。因此 <span class="nb">${mi(t`\sum_i 2^{D-\ell_i}\le 2^D`)}；</span>两边除以 <span class="nb">${mi('2^D')}。</span>`, 'li')}
   </ol>`, { k: 1 })}
 </div>
 <div>${treeFig({ kraft: true })}</div>
</div>
${key(`长度为 ${mi(t`\ell`)} 的码字要花掉总预算 1 中的 <span class="nb">${mi(t`2^{-\ell}`)}。</span>短码字很贵。`, 3)}`,
notes: NOTES_ZH[3] });

add({ part: 0, proof: true, title: 'Kraft 是紧的：只需码长', body: `
<div class="cols" style="--c:1fr 560px;--g:48px">
 <div>
  ${env('Theorem', '逆定理', `若 <span class="nb">${mi(t`\sum_i 2^{-\ell_i}\le 1`)}，</span>则存在码长为 ${mi(t`\ell_1,\dots,\ell_m`)} 的前缀码。`, { label: 'kraftconv' })}
  ${proof(`将码长排序 <span class="nb">${mi(t`\ell_1\le\dots\le\ell_m`)}，</span>令 <span class="nb">${mi(t`S_i=\sum_{j<i}2^{-\ell_j}`)}。</span>每个 ${mi('j<i')} 的 ${mi(t`2^{-\ell_j}`)} 都是 ${mi(t`2^{-\ell_i}`)} 的倍数，且 <span class="nb">${mi(t`S_i+2^{-\ell_i}\le 1`)}，</span>所以 ${mi(t`S_i`)} 恰有 ${mi(t`\ell_i`)} 位的二进制展开 <span class="nb">${mi(t`c_i`)}，</span>满足 <span class="nb">${mi(t`I_{c_i}=[S_i,S_i+2^{-\ell_i})`)}。</span>这些区间首尾相接，因而两两不交，由${ref('dyadic')}，没有 ${mi(t`c_i`)} 是另一个的前缀。`, { k: 1 })}
 </div>
 <div>
  ${step(2, `<table class="t mono wide">
   <tr><th>i</th><th class="r">ℓᵢ</th><th class="r">Sᵢ</th><th>cᵢ</th><th>I(cᵢ)</th></tr>
   ${CANON.map((c, i) => { const l = c.length, S = CANON.slice(0, i).reduce((s, d) => s + 2 ** -d.length, 0), fr = v => { if (v === 0 || v === 1) return String(v); let n = v * 2 ** l, d = 2 ** l; while (n % 2 === 0) { n /= 2; d /= 2; } return `${n}/${d}`; }; return `<tr><td>${i + 1}</td><td class="r">${l}</td><td class="r">${fr(S)}</td><td><b>${c}</b></td><td>[${fr(S)}, ${fr(S + 2 ** -l)})</td></tr>`; }).join('')}
  </table>
  <p class="small">码长 1, 2, 2 → <span class="nb"><span class="mono">${CANON.join(', ')}</span>：</span>区间恰好铺满 <span class="nb">[0, 1)。</span>DEFLATE 只传码长，再重建这个<b>规范码</b>（canonical code）。</p>`)}
 </div>
</div>
${key(`码长为 ${mi(t`\ell_i`)} 的前缀码存在当且仅当 <span class="nb">${mi(t`\sum_i 2^{-\ell_i}\le 1`)}：</span>只有码长要紧。`, 3)}`,
notes: NOTES_ZH[4] });

add({ part: 0, proof: true, title: 'McMillan：唯一可译也换不来更短的码', body: `
${env('Theorem', 'McMillan 1956', `任意唯一可译码都满足 <span class="nb">${mi(t`\sum_x 2^{-\ell_x}\le 1`)}。</span>`, { label: 'mcmillan' })}
<div class="cols" style="--c:1fr 500px;--g:48px">
 ${proof(`令 <span class="nb">${mi(t`K=\sum_x 2^{-\ell_x}`)}，</span>反设 <span class="nb">${mi('K>1')}。</span>考察由 ${mi('k')} 个符号组成的消息。
 <ol class="psteps">
  ${step(1, `<b>展开。</b>${mi(t`K^k`)} 的每一项对应一条消息，指数就是这条消息的编码总长 <span class="nb">${mi('t')}：</span>${md(t`K^k=\sum_{x_1,\dots,x_k}2^{-(\ell_{x_1}+\cdots+\ell_{x_k})}=\sum_{t=1}^{k\ell_{\max}}N_k(t)\,2^{-t},`, 'sm')}其中 ${mi(t`N_k(t)`)} = 编码恰为 ${mi('t')} 比特的消息条数。`, 'li')}
  ${step(2, `<b>计数。</b>唯一可译 ⇒ 不同消息得到不同的 ${mi('t')} 比特串，而这样的串只有 ${mi('2^t')} 个。所以 <span class="nb">${mi(t`N_k(t)\,2^{-t}\le 1`)}，</span>从而 ${md(t`K^k\le k\ell_{\max}\quad\text{对所有 }k.`, 'sm')}`, 'li')}
  ${step(3, `<b>矛盾。</b>${mi(t`K^k`)} 指数增长，${mi(t`k\ell_{\max}`)} 只线性增长。所以 <span class="nb">${mi(t`K\le 1`)}。</span>`, 'li')}
 </ol>`, { k: 1 })}
 <div>
  ${step(3, linePlot({ w: 500, h: 300, pb: 50, x: [0, 20], y: [0, 90], xt: [0, 5, 10, 15, 20], yt: [0, 30, 60, 90], xl: 'k', yl: '数值', label: 'K^k versus k·ℓmax for K = 5/4, ℓmax = 2',
    series: [{ cls: 'curve2', pts: [[0, 0], [20, 20 * MCM.lmax]] }, { cls: 'curve', pts: MCM.pts }],
    marks: [{ x: MCM.cross, y: MCM.K ** MCM.cross, label: `k = ${MCM.cross}`, dx: -12, dy: -14, anchor: 'end' }],
    legend: [{ cls: 'curve', label: 'Kᵏ = 1.25ᵏ' }, { cls: 'curve2', label: 'k·ℓmax = 2k' }], legendAt: [96, 34] }))}
  <p class="cap" data-step="3">例：码 ${mi(t`\{0,1,01\}`)} 的 <span class="nb">${mi(t`K=\tfrac54`)}，</span>它不唯一可译（<span class="mono nb">0·1 = 01</span>）。上界 ${mi(t`1.25^k\le 2k`)} 在 ${mi(`k=${MCM.cross}`)} 时就已不成立。</p>
 </div>
</div>
${key(`唯一可译换不来任何好处：由${ref('kraftconv')}，存在码长完全相同的前缀码。`, 4)}`,
notes: `McMillan：唯一可译码（不要求前缀）也满足 Kraft，所以放宽前缀限制换不来更短的码长。反证：设 K = Σ2^{-ℓ_x} > 1。第一步展开：K^k 是 k 个括号相乘，每一项是从每个括号里各挑一个符号，也就是一条 k 个符号的长消息，指数正好是它拼接编码的总长度 t；按 t 合并同类项得 Σ N_k(t)2^{-t}（t 的下界其实是 k，从 1 开始只是放宽）。第二步计数，这是唯一用到唯一可译的地方：不同消息编码不同，而 t 比特串只有 2^t 个，所以 N_k(t) ≤ 2^t，每组贡献不超过 1，共 kℓmax 组，K^k ≤ kℓmax 对所有 k 成立。第三步：左边指数、右边线性，k 够大必矛盾。右图：不唯一可译的码 {0,1,01} 有 K = 5/4，1.25^k 从 k=16 起超过 2k（JS 计算并断言）——如果它满足第二步，就会和图矛盾，所以第二步对它不成立。结论：只研究前缀码（树）不失一般性。` });

add({ part: 0, title: '熵、相对熵与 Gibbs 不等式', body: `
<div class="cols" style="--g:44px">
 <div>
  ${env('Definition', '熵', `对有限字母表上的分布 <span class="nb">${mi('p')}，</span>${md(t`H(p)=\sum_x p(x)\log_2\frac{1}{p(x)}\quad\text{比特},`)}即<b>惊讶度</b> ${mi(t`\log_2\frac{1}{p(x)}`)} 的期望。`)}
  ${step(1, `<table class="t">
    <tr><th>信源</th><th>p</th><th class="r">H(p)</th></tr>
    <tr><td>公平硬币</td><td class="mono">(1/2, 1/2)</td><td class="r mono">${fmt(H([.5, .5]))}</td></tr>
    <tr><td>贯穿全讲的例子</td><td class="mono">(1/2, 1/4, 1/4)</td><td class="r mono">${fmt(H([.5, .25, .25]))}</td></tr>
    <tr><td>偏斜硬币</td><td class="mono">(0.99, 0.01)</td><td class="r mono">${fmt(skewH)}</td></tr>
    <tr><td>均匀字节</td><td class="mono">(1/256, …)</td><td class="r mono">${fmt(H(Array(256).fill(1 / 256)))}</td></tr></table>`)}
 </div>
 <div>
  ${env('Definition', '相对熵', `对 ${mi('p')} 和次概率 ${mi('q')}（<span class="nb">${mi(t`\sum_x q(x)\le 1`)}），</span>${md(t`D(p\,\|\,q)=\sum_x p(x)\log_2\frac{p(x)}{q(x)}.`)}`, { k: 2 })}
  ${env('Lemma', 'Gibbs', `<span class="nb">${mi(t`D(p\,\|\,q)\ge 0`)}，</span>当且仅当 ${mi('q=p')} 时取等。`, { label: 'gibbs', k: 2 })}
  ${proof(`对 ${mi(t`p(x)>0`)} 的 ${mi('x')} 求和。由于 ${mi(t`\log_2`)} 严格凹，Jensen 不等式给出 ${md(t`-D(p\,\|\,q)=\sum_x p(x)\log_2\frac{q(x)}{p(x)}\le\log_2\sum_x q(x)\le 0.`)}取等要求 ${mi('q/p')} 为常数且 <span class="nb">${mi(t`\sum_x q(x)=1`)}，</span>即 <span class="nb">${mi('q=p')}。</span>`, { k: 3 })}
 </div>
</div>`,
notes: NOTES_ZH[5] });

add({ part: 0, proof: true, title: 'Shannon 信源编码定理', body: `
${env('Theorem', 'Shannon 1948', `前缀码的最小期望码长 ${mi(t`L^*=\min\sum_x p(x)\,\ell_x`)} 满足 <span class="nb">${mi(t`\;H(p)\;\le\;L^*\;<\;H(p)+1`)}。</span>`, { label: 'sct' })}
<div class="cols" style="--g:44px">
 ${proof(`任取一个前缀码，令 <span class="nb">${mi(t`q(x)=2^{-\ell_x}`)}，</span>由${ref('kraft')}有 <span class="nb">${mi(t`\sum_x q(x)\le 1`)}。</span>于是 ${md(t`L-H=\sum_x p(x)\log_2\frac{p(x)}{2^{-\ell_x}}=D(p\,\|\,q)\;\ge\;0,`)}最后一步用到${ref('gibbs')}。`, { k: 1, of: '证明（下界）' })}
 ${proof(`令 <span class="nb">${mi(t`\ell_x=\lceil\log_2\frac{1}{p(x)}\rceil`)}。</span>则 <span class="nb">${mi(t`\sum_x2^{-\ell_x}\le\sum_x p(x)=1`)}，</span>由${ref('kraftconv')}存在具有这些码长的前缀码，并且 ${md(t`\ell_x<\log_2\frac{1}{p(x)}+1\;\Rightarrow\;L<H(p)+1.`)}`, { k: 2, of: '证明（上界）' })}
</div>
${env('Corollary', '分块编码', `把 ${mi('n')} 个独立同分布符号组成的块当作一个字母来编码，得到 <span class="nb">${mi(t`H(p)\le L_n/n<H(p)+\frac1n`)}，</span>因为 <span class="nb">${mi(t`H(p^{\otimes n})=nH(p)`)}。</span>`, { k: 3 })}
${key(`${mi('x')} 的理想码长：${mi(t`\log_2\frac{1}{p(x)}`)} 比特。这是任何算法都打不破的界限，就像比较排序需要 ${mi(t`\log_2 n!\approx n\log_2 n`)} 次比较（随机排列的熵）。`, 4)}`,
notes: NOTES_ZH[6] });

/* ---------------- Part II: Coders ---------------- */
add({ part: 1, chip: true, title: 'Huffman：反复合并概率最小的两个', body: `
<div class="cols" style="--c:1fr 600px">
 <div>
  ${algo('Huffman(p)：用堆实现，O(m log m)', [
    'Q ← min-heap of leaves     // 按概率排序',
    'while |Q| ≥ 2:',
    ['    x ← pop-min(Q);  y ← pop-min(Q)', '1 2'],
    ['    push(Q, node(x, y), weight pₓ + p_y)', '1 2'],
    'return the last tree in Q  // 剩下的那棵树',
  ])}
  ${step(2, `<p>码字 <span class="nb">${mi(t`a\mapsto\mathtt0,\ b\mapsto\mathtt{10},\ c\mapsto\mathtt{11}`)}，</span>且 ${md(t`L=\tfrac12\cdot1+\tfrac14\cdot2+\tfrac14\cdot2=1.5=H(p).`)}${mi('p')} 是二进概率：${ref('sct')}的下界取等。</p>`)}
 </div>
 <div>${huffFig()}</div>
</div>
${key('贪心选择：概率最小的两个符号成为最深的一对兄弟。下一页：为什么这是最优的。', 2)}`,
notes: NOTES_ZH[7] });

add({ part: 1, proof: true, title: 'Huffman 是最优的：交换论证', body: `
<div class="cols" style="--g:44px">
 <div>
  ${env('Lemma', '交换', `设 ${mi('x,y')} 是概率最小的两个符号。存在一棵最优码树，其中 ${mi('x,y')} 是最大深度上的一对兄弟叶子。`, { label: 'hx' })}
  ${proof(`最优树中每个内部节点都有两个孩子（否则可以把它收缩掉，缩短码字），所以最深的叶子 ${mi('u')} 有一个兄弟叶子 <span class="nb">${mi('v')}。</span>交换 ${mi('x')} 与 <span class="nb">${mi('u')}，</span>${mi('L')} 的变化为 <span class="nb">${mi(t`(p_x-p_u)(d_u-d_x)\le 0`)}，</span>因为 ${mi(t`p_x\le p_u`)} 且 <span class="nb">${mi(t`d_x\le d_u`)}。</span>同理交换 ${mi('y')} 与 <span class="nb">${mi('v')}。</span>`, { k: 1 })}
  ${env('Lemma', '合并', `若 ${mi('x,y')} 是 ${mi('T')} 中的兄弟叶子，${mi(t`T'`)} 把它们替换为一个叶子 <span class="nb">${mi('z')}，</span><span class="nb">${mi(t`p_z=p_x+p_y`)}，</span>则 <span class="nb">${mi(t`L(T)=L(T')+p_x+p_y`)}。</span>`, { label: 'hm', k: 2 })}
  ${proof(`${mi('x,y')} 比 ${mi('z')} 深一层：<span class="nb">${mi(t`p_x(d+1)+p_y(d+1)=p_z\,d+p_x+p_y`)}。</span>`, { k: 2 })}
 </div>
 <div>
  ${env('Theorem', 'Huffman 1952', `Huffman 算法返回最优前缀码。`, { label: 'huff', k: 3 })}
  ${proof(`对字母表大小 ${mi('m')} 归纳；${mi('m=2')} 显然。Huffman 把概率最小的 ${mi('x,y')} 合并为 <span class="nb">${mi('z')}，</span>再构造 <span class="nb">${mi(t`T'_H`)}，</span>由归纳假设它对 ${mi('(m-1)')} 个符号的实例最优。对任意树 <span class="nb">${mi('T')}，</span>由${ref('hx')}可设 ${mi('x,y')} 是兄弟，再由${ref('hm')} ${md(t`L(T)=L(T')+p_x+p_y\;\ge\;L(T'_H)+p_x+p_y=L(T_H).`, 'sm')}`, { k: 3 })}
 </div>
</div>`,
notes: NOTES_ZH[8] });

add({ part: 1, title: 'Huffman 每个符号最多多付 1 比特', body: `
<div class="cols" style="--c:1fr 640px;--g:44px">
 <div>
  ${env('Proposition', '', `对二元信源 <span class="nb">${mi('(p,1-p)')}，</span>每个前缀码都有 <span class="nb">${mi(t`L\ge 1`)}，</span>所以其冗余为 ${md(t`L-H\;\ge\;1-h(p)\;\xrightarrow{\;p\to1\;}\;1.`, 'sm')}`, { label: 'tax' })}
  ${proof(`两个码字都非空。Huffman 达到 <span class="nb">${mi('L=1')}。</span>`)}
  ${step(1, `<table class="t" style="margin-bottom:14px"><tr><th>p = (0.99, 0.01)</th><th>H(p)</th><th>L</th><th>每符号浪费</th></tr>
  <tr><td></td><td class="mono">${fmt(skewH, 4)}</td><td class="mono">${skewL}</td><td class="mono"><b>${fmt(skewL - skewH, 4)}</b> ≈ ${Math.round((skewL - skewH) / skewH)}× H</td></tr></table>`)}
  ${env('Corollary', '分块', `对 ${mi('k')} 个符号组成的块做 Huffman，每符号浪费 ${mi(t`<1/k`)} 比特（对块信源应用${ref('sct')}），但需要 ${mi(t`m^k`)} 个码字。`, { k: 2 })}
 </div>
 <div>${linePlot({ w: 640, h: 440, x: [.5, 1], y: [0, 1.05], xt: [.5, .6, .7, .8, .9, 1], yt: [0, .25, .5, .75, 1], xl: '较可能符号的概率 p（二元信源）', yl: '每符号浪费的比特', label: 'Huffman redundancy 1 − h(p) for a binary source',
    series: [{ cls: 'curve', pts: Array.from({ length: 200 }, (_, i) => { const p = .5 + i * .4999 / 199; return [p, 1 - hb(p)]; }) }],
    marks: [{ x: .99, y: 1 - skewH, label: `p = 0.99：${fmt(1 - skewH)}`, dx: -14, dy: 24, anchor: 'end', extra: 'data-step="1"' }] })}</div>
</div>
${key('出路：不再逐个符号付费，把整条消息编码成一个数。', 3)}`,
notes: NOTES_ZH[9] });

add({ part: 1, chip: true, title: '算术编码：一条消息就是 [0, 1) 的一个子区间', body: `
<div class="cols" style="--c:820px 1fr;--g:44px">
 <div>
  ${algo('算术编码器（精确算术）', [
    'low ← 0;  width ← 1',
    'for each symbol s:          // 模型给出 p(s | 过去)',
    '    low   ← low + width · c[s] / M',
    '    width ← width · f[s] / M',
    'k ← ⌈log₂(1 / width)⌉ + 1',
    'output k bits b₁…b_k        // 其二进区间满足',
    '    [0.b₁…b_k, 0.b₁…b_k + 2^(−k)) ⊆ [low, low+width)',
  ])}
  ${step(2, algo('算术解码器', [
    'v ← received number;  low ← 0;  width ← 1',
    'repeat n times:',
    '    s ← symbol with c[s] ≤ M·(v−low)/width < c[s]+f[s]',
    '    output s;  update low, width   // 与编码器相同',
  ]))}
 </div>
 <div>
  ${env('Lemma', '不变量', `读入 ${mi(t`s_1\dots s_n`)} 后，编码器维护 <span class="nb">${mi(t`I(s_{1:n})=[\text{low},\,\text{low}+\text{width})`)}，</span>其中 ${md(t`\text{width}=\prod_{i=1}^{n}p(s_i)=P(s_{1:n}),`, 'sm')}并且长度为 ${mi('n')} 的不同消息对应的区间两两不交。`, { label: 'acinv', k: 1 })}
  ${proof(`对 ${mi('n')} 归纳：每一步把 ${mi(t`I(s_{1:n-1})`)} 切成首尾相接的若干段，每个符号 ${mi('s')} 一段，宽度为 <span class="nb">${mi(t`\text{width}\cdot f_s/M`)}。</span>`, { k: 1 })}
 </div>
</div>
${key(`编码器每一步只需要 <span class="nb">${mi(t`p(s\mid\text{过去})`)}，</span>所以任何模型都能接上：<b>模型 / 编码器分离</b>。`, 3)}`,
notes: NOTES_ZH[10] });

add({ part: 1, chip: true, title: '算术编码实算：“bac”', body: `
<div class="cols" style="--c:860px 1fr;--g:40px">
 <div>${acFig()}</div>
 <div class="vstack">
  <div class="stack">
   ${AC.trace.map((r, i) => only(i + 1, `<div class="calc"><p><b>读入 ${r.s}</b> &nbsp;(c = ${CUM[r.s]}, f = ${F[r.s]})</p>${md(t`\text{low}=${r.lo.tex()}+${r.w.tex()}\cdot\tfrac{${CUM[r.s]}}{4}=${r.nl.tex()}`, 'sm')}${md(t`\text{width}=${r.w.tex()}\cdot\tfrac{${F[r.s]}}{4}=${r.nw.tex()}`, 'sm')}</div>`)).join('')}
   ${only(4, `<div class="calc"><p><b>输出</b></p>${md(t`\text{width}=\tfrac{1}{32}\;\Rightarrow\; \log_2 32 = 5 = 2+1+2\text{ 比特}`, 'sm')}<p>${mi(t`[\tfrac{19}{32},\tfrac{20}{32})`)} 本身就是二进区间：发送 <span class="mono"><b>10011</b></span>。</p></div>`)}
  </div>
  ${step(4, `<div class="box"><span class="lbl">实际的代价</span><ul class="small" style="margin:0">
    <li>两个耦合的状态变量（low、range）+ 进位传播。</li>
    <li>有限精度 ⇒ 需要逐位重整化。</li>
    <li>解码时每个符号需要一次<b>除法</b>才能找到 <span class="nb">${mi('s')}。</span></li></ul></div>`)}
 </div>
</div>`,
notes: NOTES_ZH[11] });

add({ part: 1, proof: true, title: '算术编码与 log 1/P 相差不到 2 比特', body: `
<div class="cols" style="--g:44px">
 <div>
  ${env('Lemma', '嵌入二进区间', `每个区间 ${mi(t`[a,a+w)\subseteq[0,1)`)} 都包含一个二进区间 <span class="nb">${mi(t`[\,j2^{-k},\,(j+1)2^{-k})`)}，</span>其中 <span class="nb">${mi(t`k=\lceil\log_2\frac1w\rceil+1`)}。</span>`, { label: 'dyfit' })}
  ${proof(`<span class="nb">${mi(t`2^{-k}\le w/2`)}。</span>令 <span class="nb">${mi(t`j=\lceil a2^k\rceil`)}，</span>则 ${mi(t`j2^{-k}\ge a`)} 且 ${md(t`(j+1)2^{-k}<a+2\cdot2^{-k}\le a+w.`, 'sm')}`, { k: 1 })}
 </div>
 <div>
  ${env('Theorem', '算术编码', `对解码器已知的固定长度 ${mi('n')} 的消息，把${ref('dyfit')}应用于 <span class="nb">${mi(t`I(x)`)}，</span>发送 ${mi('j')} 的 ${mi('k')} 位，得到一个前缀码，且 ${md(t`\ell(x)\;<\;\log_2\frac{1}{P(x)}+2.`)}`, { label: 'acthm', k: 2 })}
  ${proof(`码长：由${ref('acinv')}，<span class="nb">${mi(t`k=\lceil\log_2\frac1{P(x)}\rceil+1`)}。</span>前缀性：每个码字的区间都落在它自己的 ${mi(t`I(x)`)} 内，而这些区间两两不交（${ref('acinv')}）；所以码字区间互不包含，由${ref('dyadic')}，没有码字是另一个的前缀。`, { k: 3 })}
 </div>
</div>
${key('每条<b>消息</b> +2 比特；而 Huffman 是每个<b>符号</b>最多 +1 比特。', 4)}`,
notes: NOTES_ZH[12] });

add({ part: 1, title: 'ANS 的想法：整数就是一个数字栈', body: `
<div class="cols">
 <div>
  <h3>十进制数字</h3>
  ${md(t`\textbf{压入 } d:\; x \leftarrow 10x+d \qquad \textbf{弹出}:\; d = x \bmod 10,\;\; x\leftarrow\lfloor x/10\rfloor`, 'sm')}
  ${digitsDemo()}
  ${step(1, `<p>每压入一位，${mi(t`\log_2 x`)} 增加 ${mi(t`\log_2 10\approx 3.32`)} 比特：恰好是一个均匀数字（<span class="nb">${mi(t`p=\tfrac{1}{10}`)}）</span>的信息量。</p>`)}
 </div>
 ${step(2, `<div>
  <h3>目标：概率不等的符号</h3>
  <p>符号 ${mi('s')} 应当花费 ${mi(t`\log_2 \frac{1}{p_s}`)} 比特，所以它必须把状态放大约 ${mi(t`1/p_s`)} 倍：</p>
  ${md(t`x' \approx \frac{x}{p_s} \iff \log_2 x' \approx \log_2 x + \log_2\frac{1}{p_s}`)}
  <p>一种“进制”随符号变化的数系：<b>非对称数系</b>（Asymmetric Numeral Systems）。</p>
 </div>`)}
</div>
${key(`ANS 把所有信息都存在一个整数 ${mi('x')} 里。可以把 ${mi(t`\log_2 x`)} 理解为目前已存储的比特数。`, 3)}`,
notes: NOTES_ZH[13] });

add({ part: 1, chip: true, title: 'rANS：按槽位给整数染色，然后跳跃', body: `
<p style="margin:0">按槽位 ${mi(t`y\bmod 4`)} 给每个整数 ${mi('y')} 染色：槽位 0、1 → a，槽位 2 → b，槽位 3 → c。</p>
${numberLineFig()}
<div class="stack">
 ${only(1, `<p class="callout">从 <b>x = 4</b> 编码 <b>b</b>：跳到 b 色整数中排第 4 的那个（从 0 数起）→ <b>x′ = 18</b>。</p>`)}
 ${only(2, `<p class="callout">从 <b>x = 18</b> 编码 <b>a</b>：跳到 a 色整数中排第 18 的那个 → <b>x′ = 36</b>。</p>`)}
</div>
<div class="cols" style="--g:40px">
 ${env('Definition', 'rANS', `符号 ${mi('s')} 占有槽位 <span class="nb">${mi(t`[c_s,c_s+f_s)\subseteq[0,M)`)}。</span>令 <span class="nb">${mi(t`I_s=\{y\in\mathbb N: y\bmod M\in[c_s,c_s+f_s)\}`)}，</span>并定义 ${md(t`C(s,x)=M\Big\lfloor\frac{x}{f_s}\Big\rfloor+c_s+(x\bmod f_s).`, 'sm')}`, { k: 3 })}
 <div>${env('Lemma', '枚举', `${mi(t`C(s,x)`)} 是 ${mi(t`I_s`)} 按递增顺序的第 ${mi('x')} 个元素（从 0 数起）。由于 ${mi(t`I_s`)} 的密度为 <span class="nb">${mi(t`f_s/M=p_s`)}，</span>有 <span class="nb">${mi(t`C(s,x)\approx x/p_s`)}。</span>`, { label: 'renum', k: 4 })}
 ${proof(`${mi(t`I_s`)} 的元素是 ${mi(t`qM+c_s+r`)}（<span class="nb">${mi(t`q\ge0,\ 0\le r<f_s`)}），</span>按 ${mi('(q,r)')} 的字典序递增；下标 ${mi(t`x=qf_s+r`)} 恰好对应 <span class="nb">${mi(t`q=\lfloor x/f_s\rfloor`)}、</span><span class="nb">${mi(t`r=x\bmod f_s`)}。</span>`, { k: 4 })}</div>
</div>`,
notes: NOTES_ZH[14] });

add({ part: 1, chip: true, title: 'rANS：一个整数状态，两个互逆映射', body: `
<div class="cols" style="--c:780px 1fr;--g:44px">
 <div>
  ${algo('rANS 核心（尚未重整化）', [
    'encode(x, s):                   // 压入 s',
    '    q ← x div f[s];   r ← x mod f[s]',
    '    return q·M + c[s] + r',
    '',
    'decode(y):                      // 弹出',
    '    slot ← y mod M        // M = 2^k 时即 y & (M−1)',
    '    s ← sym[slot]         // 大小为 M 的表',
    '    return (s, f[s]·(y div M) + slot − c[s])',
  ])}
  <table class="t mono"><tr><th>s</th><th>f[s]</th><th>c[s]</th><th>槽位</th></tr>${SYM.map(s => `<tr><td>${symTag(s)}</td><td>${F[s]}</td><td>${CUM[s]}</td><td>${Array.from({ length: F[s] }, (_, i) => CUM[s] + i).join(', ')}</td></tr>`).join('')}</table>
 </div>
 <div>
  ${env('Corollary', '解码', `集合 ${mi(t`I_s`)} 划分 <span class="nb">${mi(t`\mathbb N`)}，</span>且 <span class="nb">${mi(t`D(C(s,x))=(s,x)`)}：</span>每个 ${mi('y')} 都恰好等于唯一一对 ${mi('(s,x)')} 的 <span class="nb">${mi(t`C(s,x)`)}。</span>`, { label: 'rinv' })}
  ${proof(`槽位区间划分 <span class="nb">${mi(t`[0,M)`)}，</span>所以各 ${mi(t`I_s`)} 划分 <span class="nb">${mi(t`\mathbb N`)}；</span>由${ref('renum')}，${mi(t`C(s,\cdot):\mathbb N\to I_s`)} 是双射。对 <span class="nb">${mi(t`y=qM+c_s+r`)}：</span>${md(t`y\bmod M=c_s+r\;\Rightarrow\;s,`, 'sm')}${md(t`\lfloor y/M\rfloor=q\;\Rightarrow\;x=f_s\,q+(y\bmod M)-c_s.`, 'sm')}`, { k: 1 })}
 </div>
</div>
${key('解码 = 一次掩码、一次查表、一次乘加。M 是 2 的幂时无需除法。', 2)}`,
notes: NOTES_ZH[15] });

add({ part: 1, chip: true, title: 'rANS 实算：从 x = 4 编码 b, a, c', body: `
<div class="cols" style="--c:800px 1fr;--g:44px">
 <div class="vstack">
  ${slotStrip(RE.tr.map(r => r.slot))}
  <table class="t mono wide">
   <tr><th>s</th><th>x</th><th>x′ = M·⌊x/f⌋ + c + (x mod f)</th><th>x′</th><th>x′ mod 4</th></tr>
   ${RE.tr.map((r, i) => `<tr data-step="${i + 1}" data-cur="${i + 1}"><td>${symTag(r.s)}</td><td>${r.before}</td><td>4·⌊${r.before}/${F[r.s]}⌋ + ${CUM[r.s]} + ${r.before % F[r.s]}</td><td><b>${r.after}</b></td><td>${r.slot} → ${r.s}</td></tr>`).join('')}
  </table>
  ${logBar()}
 </div>
 <div class="vstack">
  ${algo('encode(x, s)', [['q ← x div f[s];   r ← x mod f[s]', '1 2 3'], ['return q·M + c[s] + r', '1 2 3']])}
  <div class="stack">${RE.tr.map((r, i) => only(i + 1, `<div class="calc"><p>${mi(t`\log_2\frac{${r.after}}{${r.before}} = ${log2(r.after / r.before).toFixed(3)}`)} 比特</p><p class="muted">理想值 ${mi(t`\log_2 \tfrac{1}{p_${r.s}} = ${log2(1 / prob(r.s))}`)} 比特</p></div>`)).join('')}</div>
  ${step(3, `<div class="key" style="margin-top:8px">存储了 ${mi(t`\log_2(147/4)=${log2(147 / 4).toFixed(2)}`)} 比特，理想值为 <span class="nb">${mi('2+1+2=5')}。</span></div>`)}
 </div>
</div>`,
notes: NOTES_ZH[16] });

const EPS = RE.tr.map(r => ({ s: r.s, e: log2(r.after / r.before) - log2(1 / prob(r.s)), b: 2 / Math.LN2 * M * prob(r.s) / r.before }));
check(EPS.every(v => Math.abs(v.e) <= v.b), 'toy trace obeys the per-symbol bound');
add({ part: 1, title: '为什么 rANS 能逼近熵', body: `
<div class="cols" style="--c:1fr 590px;--g:40px">
 <div>
  <p class="small" style="margin:0 0 12px"><b>理想编码器：</b><span class="nb">${mi(t`x\mapsto x/p_s`)}，</span>于是 ${mi(t`\log_2 x`)} 恰好增加 ${mi(t`\log_2\frac{1}{p_s}`)} 比特。<b>rANS</b> 却必须输出整数。这要付出多少代价？</p>
  ${env('Lemma', '取整误差', `对所有 ${mi('s')} 和 <span class="nb">${mi('x')}，</span>${md(t`\Big|\,C(s,x)-\frac{x}{p_s}\,\Big| < M.`)}`, { label: 'rapprox' })}
  ${env('Theorem', '单个符号的代价', `若 <span class="nb">${mi(t`x\ge 2Mp_s`)}，</span>则 ${md(t`\log_2 C(s,x)=\log_2 x+\log_2\frac{1}{p_s}+\varepsilon,\qquad |\varepsilon|\le\frac{2}{\ln 2}\cdot\frac{Mp_s}{x}.`)}`, { label: 'rcost', k: 1 })}
  ${env('Corollary', '整条消息', `存储的比特 = 理想值 + 损失：${md(t`\log_2\frac{x_n}{x_0}=\sum_{i=1}^{n}\log_2\frac{1}{p(s_i)}+\sum_{i=1}^{n}\varepsilon_i.`)}`, { label: 'rtel', k: 2 })}
 </div>
 ${step(3, `<div class="vstack">
  <h3 style="margin:0">在 b, a, c 的 trace 上验证（M = 4）</h3>
  <table class="t mono wide tight">
   <tr><th>s</th><th class="r">x</th><th class="r">x/pₛ</th><th class="r">C</th><th class="r">差值</th><th class="r">ε</th><th class="r">上界</th></tr>
   ${RE.tr.map((r, i) => { const ideal = r.before / prob(r.s), gap = r.after - ideal; return `<tr><td>${symTag(r.s)}</td><td class="r">${r.before}</td><td class="r">${ideal}</td><td class="r"><b>${r.after}</b></td><td class="r">${gap > 0 ? '+' : ''}${gap}</td><td class="r"><b>${EPS[i].e.toFixed(3)}</b></td><td class="r">${EPS[i].b.toFixed(3)}</td></tr>`; }).join('')}
  </table>
  <p class="small" style="margin:0">C = C(s, x)；差值 = C − x/pₛ；ε 及其上界以比特计。</p>
  <p class="small" style="margin:0">每个差值都小于 <span class="nb">${mi('M=4')}。</span>${mi('x')} 越大，同样的差值在 ${mi(t`x/p_s`)} 中占的比例越小，所以 ${mi(t`\varepsilon`)} 的上界随之缩小。</p>
 </div>`)}
</div>
${key(`每个符号把 ${mi('x')} 放大约 ${mi(t`1/p_s`)} 倍，误差不到 <span class="nb">${mi('M')}：</span>只要 ${mi('x')} 足够大，${mi(t`\log_2 x`)} 就紧跟熵。`, 4)}`,
notes: NOTES_ZH[17] });

add({ part: 1, proof: true, title: '证明：取整误差小于 M，只多花 O(M·pₛ/x) 比特', body: `
<div class="cols" style="--g:44px">
 ${proof(`写 <span class="nb">${mi(t`x=q f_s+r`)}，</span>其中 <span class="nb">${mi(t`0\le r<f_s`)}。</span>
 <ol class="psteps">
  ${step(1, `<b>两个值。</b> ${md(t`C(s,x)=qM+c_s+r,\qquad \frac{x}{p_s}=\frac{xM}{f_s}=qM+\frac{rM}{f_s}.`, 'sm')}`, 'li')}
  ${step(1, `<b>相减。</b> ${md(t`C(s,x)-\frac{x}{p_s}=c_s-r\Big(\frac{M}{f_s}-1\Big).`, 'sm')}`, 'li')}
  ${step(2, `<b>逐项估计。</b> 由于 <span class="nb">${mi(t`r<f_s`)}：</span>${md(t`0\le c_s\le M-f_s,\qquad 0\le r\Big(\frac{M}{f_s}-1\Big)<f_s\cdot\frac{M}{f_s}=M.`, 'sm')}因此 ${md(t`-M<C(s,x)-\frac{x}{p_s}\le M-f_s<M.`, 'sm')}`, 'li')}
 </ol>`, { of: `${ref('rapprox')} 的证明` })}
 <div>
 ${proof(`
 <ol class="psteps">
  ${step(3, `<b>相对误差。</b> 令 <span class="nb">${mi(t`C=\frac{x}{p_s}(1+u)`)}，</span>于是 <span class="nb">${mi(t`\varepsilon=\log_2(1+u)`)}。</span>`, 'li')}
  ${step(3, `<b>用引理。</b> ${md(t`|u|=\frac{|C-x/p_s|}{x/p_s}<\frac{Mp_s}{x}\le\frac12\quad(\text{因为 }x\ge 2Mp_s).`, 'sm')}`, 'li')}
  ${step(4, `<b>估计对数。</b> 当 ${mi(t`|u|\le\frac12`)} 时 <span class="nb">${mi(t`|\ln(1+u)|\le 2|u|`)}，</span>所以 ${md(t`|\varepsilon|=\frac{|\ln(1+u)|}{\ln 2}\le\frac{2}{\ln 2}\cdot\frac{Mp_s}{x}.`, 'sm')}`, 'li')}
 </ol>`, { of: `${ref('rcost')} 的证明`, k: 3 })}
 ${proof(`望远镜求和 ${md(t`\log_2\frac{x_n}{x_0}=\sum_{i=1}^{n}\log_2\frac{x_i}{x_{i-1}},`, 'sm')}再对每一项应用${ref('rcost')}。`, { of: `${ref('rtel')} 的证明`, k: 5 })}
 </div>
</div>
${key(`在 ${mi(t`x/p_s`)} 中误差不到 ${mi('M')} ⇒ 相对误差 ${mi(t`< Mp_s/x`)} ⇒ 至多多花 ${mi(t`O(Mp_s/x)`)} 比特。`, 6)}`,
notes: NOTES_ZH[18] });

add({ part: 1, chip: true, title: 'ANS 是栈：解码器倒序弹出', body: `
<div class="cols" style="--c:800px 1fr;--g:44px">
 <div class="vstack">
  ${slotStrip(RD.map(r => r.r))}
  <table class="t mono wide">
   <tr><th>y</th><th>槽位 = y mod 4</th><th>s</th><th>x = f·⌊y/4⌋ + 槽位 − c</th><th>x</th></tr>
   ${RD.map((r, i) => `<tr data-step="${i + 1}" data-cur="${i + 1}"><td>${r.y}</td><td>${r.r}</td><td>${symTag(r.s)}</td><td>${F[r.s]}·⌊${r.y}/4⌋ + ${r.r} − ${CUM[r.s]}</td><td><b>${r.x}</b></td></tr>`).join('')}
  </table>
  ${step(4, `<p class="lead" style="margin-top:6px">编码 <b>b, a, c</b> → 解码得到 <b>${RD.map(r => r.s).join(', ')}</b>。</p>`)}
  ${step(5, `<div class="calc"><p><b>修正：倒序压入。</b> 编码 c, a, b：&nbsp;<span class="mono">4 → ${REV.tr.map(r => r.after).join(' → ')}</span></p><p>解码 ${REV.x}：&nbsp;<span class="mono"><b>${REVD.join(', ')}</b></span>——恢复了阅读顺序。</p></div>`)}
 </div>
 <div class="vstack">
  ${algo('decode(y)', [['slot ← y mod M', '1 2 3'], ['s ← sym[slot]', '1 2 3'], ['return (s, f[s]·(y div M) + slot − c[s])', '1 2 3']])}
  ${step(4, `<p>由${ref('rinv')}，${mi('D')} 撤销的是<i>最后一次</i> <span class="nb">${mi('C')}。</span>所以编码器要<b>倒序</b>处理消息。</p><p class="small muted">自适应模型：先正向运行模型，把一个块内每一步的 ${mi(t`p(s\mid\text{过去})`)} 存下来，再倒序编码这个块。解码器只需正向运行。</p>`)}
 </div>
</div>
${key('算术编码是队列（FIFO）。ANS 是栈（LIFO）。', 6)}`,
notes: NOTES_ZH[19] });

add({ part: 1, chip: true, title: '重整化：让 x 保持在 [L, bL)，把低位数字流式输出', body: `
<div class="cols" style="--c:760px 1fr;--g:44px">
 <div>${algo('流式 rANS', [
    '// 不变量  L ≤ x < b·L，L 是 M 的倍数',
    '// 实践中  b = 2⁸（字节），L = 2²³',
    'encode(s):',
    '    x_max ← (L / M) · b · f[s]',
    ['    while x ≥ x_max:', '1 2 3'],
    ['        emit(x mod b);  x ← x div b', '1 2 3'],
    ['    x ← C(s, x)              // 回到 [L, bL)', '1 2 3'],
    'decode():',
    '    (s, x) ← D(x)',
    '    while x < L:',
    '        x ← b·x + read()     // LIFO',
    '    return s',
  ])}</div>
 <div class="vstack">
  <p class="small" style="margin:0">玩具例子：${mi('b=2')}（按比特），<span class="nb">${mi('L=M=4')}，</span>所以 <span class="nb">${mi(t`x\in\{4,5,6,7\}`)}。</span></p>
  <table class="t mono wide"><tr><th>s</th><th>x</th><th>x_max</th><th>输出</th><th>x′</th></tr>
   ${TOY.tr.map((r, i) => `<tr data-step="${i + 1}" data-cur="${i + 1}"><td>${symTag(r.s)}</td><td>${r.before}</td><td>${r.xmax}</td><td><b>${r.emit.join('')}</b> → ${r.mid}</td><td><b>${r.after}</b></td></tr>`).join('')}</table>
  ${step(3, `<p class="small">共输出 <span class="mono"><b>${TOY.out.join('')}</b></span>：5 比特 = 2 + 1 + 2，恰好等于 ${mi(t`\log_2\frac{1}{P}`)}（p 是二进概率）。最后再写出终态 ${TOY.x}。</p>`)}
 </div>
</div>
${key('数字从状态的低位离开；状态始终是一个机器字。为什么它精确可逆：见下一页。', 4)}`,
notes: NOTES_ZH[20] });

add({ part: 1, proof: true, title: '流式 rANS 精确可逆', body: `
<div class="cols" style="--g:40px">
 <div>
  ${env('Lemma', '范围', `设 <span class="nb">${mi(t`M\mid L`)}，</span><span class="nb">${mi(t`A_s=\frac{L}{M}f_s`)}。</span>则 <span class="nb">${mi(t`C(s,x)\in[L,bL)\iff x\in[A_s,\,bA_s)`)}。</span>`, { label: 'rrange' })}
  ${proof(`<span class="nb">${mi(t`C(s,x)=Mq+(c_s+r)`)}，</span>其中 <span class="nb">${mi(t`q=\lfloor x/f_s\rfloor`)}，</span><span class="nb">${mi(t`0\le c_s+r<M`)}。</span>由于 ${mi('L')} 和 ${mi('bL')} 都是 ${mi('M')} 的倍数：<span class="nb">${mi(t`C\in[L,bL)\iff\frac{L}{M}\le q<\frac{bL}{M}\iff A_s\le x<bA_s`)}。</span>`, { k: 1 })}
  ${env('Lemma', '移位循环', `若 <span class="nb">${mi(t`L\le x<bL`)}，</span>循环“while <span class="nb">${mi(t`x\ge bA_s`)}：</span>${mi(t`x\leftarrow\lfloor x/b\rfloor`)}”结束时 <span class="nb">${mi(t`x\in[A_s,bA_s)`)}。</span>`, { label: 'rloop', k: 2 })}
  ${proof(`初始时 <span class="nb">${mi(t`x\ge L\ge A_s`)}。</span>对 ${mi(t`x\ge bA_s`)} 做除法得到 <span class="nb">${mi(t`\lfloor x/b\rfloor\ge A_s`)}，</span>而一旦 <span class="nb">${mi(t`x<bA_s`)}，</span>循环就停止。`, { k: 2 })}
 </div>
 <div>
  ${env('Theorem', '', `每个解码步骤恰好读回对应编码步骤输出的数字，并恢复之前的状态。`, { label: 'rstream', k: 3 })}
  ${proof(`设 ${mi(t`x_0\in[L,bL)`)} 是编码 ${mi('s')} 之前的状态，共输出 ${mi('k')} 个数字；新状态为 <span class="nb">${mi(t`C(s,\lfloor x_0/b^k\rfloor)`)}。</span>由${ref('rinv')}，解码器恢复出 ${mi('s')} 和 <span class="nb">${mi(t`\lfloor x_0/b^k\rfloor`)}。</span>读回 ${mi('j<k')} 个数字后，它持有 <span class="nb">${mi(t`\lfloor x_0/b^{k-j}\rfloor\le x_0/b<L`)}，</span>于是继续读；读满 ${mi('k')} 个数字后，它持有 <span class="nb">${mi(t`x_0\ge L`)}，</span>停止。`, { k: 3 })}
  ${env('Corollary', '开销', `每次 ${mi('C')} 之前都有 <span class="nb">${mi(t`x\ge A_s`)}，</span>所以 <span class="nb">${mi(t`Mp_s/x\le M/L`)}，</span>由${ref('rcost')}得 <span class="nb">${mi(t`|\varepsilon|\le\frac{2}{\ln2}\cdot\frac{M}{L}`)}。</span>取 <span class="nb">${mi(t`L=2^{16}M`)}：</span>每个符号 ${mi(t`|\varepsilon|<5\cdot10^{-5}`)} 比特。`, { k: 4 })}
 </div>
</div>`,
notes: NOTES_ZH[21] });

add({ part: 1, chip: true, title: 'L = M 时，流式 rANS 就是有限状态机：tANS', body: `
<div class="cols" style="--c:700px 1fr;--g:56px">
 <div>
  <table class="t mono wide" style="font-size:23px"><tr><th>状态 x</th>${SYM.map(s => `<th>${symTag(s)}</th>`).join('')}</tr>
  ${[4, 5, 6, 7].map(x => `<tr><td><b>${x}</b></td>${SYM.map(s => { const k = TOY.tr.findIndex(r => r.s === s && r.before === x); return `<td${k >= 0 ? ` data-cur="${k + 1}"` : ''}>${FSM[x][s].bits} → ${FSM[x][s].next}</td>`; }).join('')}</tr>`).join('')}</table>
  <p class="cap">表项 = 输出的比特 → 下一个状态。全部 12 个表项都由流式编码器算出（b = 2, L = M = 4）。</p>
  <p class="mono" style="font-size:24px;margin-top:18px">4 ${step(1, '—b/00→ 6', 'span')} ${step(2, '—a/0→ 5', 'span')} ${step(3, '—c/10→ 7', 'span')}</p>
 </div>
 <div>
  ${env('Proposition', '', `当 ${mi('b=2')} 且 ${mi('L=M')} 时，状态总在 ${mi(t`[M,2M)`)} 中，所以编码器和解码器都是有 ${mi('M')} 个状态的有限状态转换器。`)}
  ${proof(`不变量 ${mi(t`L\le x<bL`)}（${ref('rstream')}）。`)}
  <p>预先算好每个（状态, 符号）→（输出比特, 下一状态）：编码变成<b>查表走路径</b>，不需要乘法或除法。</p>
  ${step(4, `<p class="small">这里 p 是二进概率，所以一个符号总是输出相同数量的比特。一般情况下，同一个符号会因状态不同输出 ${mi(t`\lfloor\log_2\frac1{p_s}\rfloor`)} 或 ${mi(t`\lceil\log_2\frac1{p_s}\rceil`)} 比特：<b>状态承载了比特的小数部分</b>。</p>`)}
 </div>
</div>
${key('tANS = 编译成查找表的 rANS：一个状态能记住“零点几比特”的有限自动机。', 4)}`,
notes: NOTES_ZH[22] });

add({ part: 1, title: '为什么 ANS 胜出', body: `
<div class="cols" style="--c:1fr 640px">
 <ul>
  <li><b>只有一个整数状态</b>，而不是 low + range + 进位。</li>
  <li><b>解码无需除法</b>：掩码、查表、乘加（rANS），或一次查表（tANS）。</li>
  <li><b>交错</b>：多个独立状态共享一个流，带来指令级、SIMD 和 GPU 并行。</li>
  <li><b>算术编码的压缩率，Huffman 般的速度</b>，这正是 Duda 论文的标题。</li>
 </ul>
 <div>
  <h3>当今的实际部署</h3>
  <table class="t wide" style="font-size:20px">
   <tr><td><b>zstd</b></td><td>字面量长度、匹配长度和偏移量用 tANS（FSE）；字面量用 Huffman</td></tr>
   <tr><td><b>LZFSE</b></td><td>Apple 的 LZ + tANS（FSE）压缩器</td></tr>
   <tr><td style="white-space:nowrap"><b>JPEG XL</b></td><td>ANS 熵编码（前缀码可选）</td></tr>
   <tr><td style="white-space:nowrap"><b>CRAM 3</b></td><td>基因组测序数据存档，rANS</td></tr>
  </table>
  <p class="small" style="margin-top:14px">由 <b>Jarek Duda</b> 发明（2009 年首个 ANS 预印本；被广泛引用的版本 arXiv 1311.2540，2013–14）。</p>
 </div>
</div>
${key('ANS 把接近最优的熵编码变成了一个廉价的系统原语。', 1)}`,
notes: NOTES_ZH[24] });

add({ part: 1, title: '三种编码器对比', body: `
<table class="t wide" style="font-size:24px;line-height:1.35">
 <tr><th></th><th>Huffman</th><th>算术编码</th><th>ANS（rANS / tANS）</th></tr>
 <tr><td><b>相对 Σ log₂ 1/p 的损失</b></td><td>每<b>符号</b> &lt; 1 比特（二进概率时为 0）</td><td>每条<b>消息</b> &lt; 2 比特（${ref('acthm')}）</td><td>每符号 <span class="nb">${mi(t`\le\frac{2}{\ln 2}\frac{M}{L}`)}，</span>外加终态</td></tr>
 <tr><td><b>解码一步</b></td><td>查表</td><td>除法 + 串行的区间更新</td><td>查表 + 乘加，或一次查表</td></tr>
 <tr><td><b>状态</b></td><td>只有位缓冲</td><td>low、range（+ 进位）</td><td>一个整数</td></tr>
 <tr><td><b>顺序</b></td><td>FIFO</td><td>FIFO</td><td>LIFO：倒序编码</td></tr>
 <tr><td><b>p 每个符号都变</b></td><td>重建树：代价高</td><td>无额外代价</td><td>缓冲一个块，再倒序编码</td></tr>
 <tr><td><b>应用</b></td><td>DEFLATE、JPEG、zstd 字面量</td><td>CABAC（H.264/HEVC）、PAQ、LLM 压缩器</td><td>zstd、LZFSE、JPEG XL</td></tr>
</table>
${key('给定 p，每个符号只花 ≈ log₂ 1/p 比特，而且很快。编码已经解决；悬而未决的是 p。', 1)}`,
notes: NOTES_ZH[25] });

/* ---------------- Part III: Models ---------------- */
add({ part: 2, title: '编码已经解决。p 从哪里来？', body: `
${pipeline('model')}
<div class="cols" style="--c:1fr 520px;margin-top:20px">
 ${step(1, `<div>${env('Proposition', '交叉熵', `对分布 <span class="nb">${mi('p,q')}，</span>${md(t`\mathbb{E}_{p}\Big[\log_2\frac{1}{q(X)}\Big] = \underbrace{H(p)}_{\text{不可避免}} + \underbrace{D(p\,\|\,q)}_{\text{模型错误的代价}}.`)}`, { label: 'xent' })}${proof(`<span class="nb">${mi(t`\log_2\frac1q=\log_2\frac1p+\log_2\frac pq`)}；</span>两边取 <span class="nb">${mi(t`\mathbb E_p`)}。</span>`)}</div>`)}
 ${step(2, `<div><h3>获得 q 的途径</h3><ul class="small">
  <li><b>计数</b>，在线更新（自适应模型）</li>
  <li><b>神经网络</b>，利用长上下文（第 IV 部分）</li></ul></div>`)}
</div>
${key('预测越好 ⇒ 比特越少。模型是唯一剩下的杠杆。', 3)}`,
notes: NOTES_ZH[26] });

add({ part: 2, title: '自适应计数：预测、付费、更新', body: `
<div class="cols" style="--c:800px 1fr;--g:44px">
 <div>
  ${algo('自适应模型 + 任意编码器', [
    'n[s] ← 0                   // 对全部 K 个符号',
    'for t = 1, 2, …, T:',
    '    q(s) ← (n[s] + α) / (t − 1 + Kα)  // 预测',
    '    encode xₜ with q          // 付 log₂ 1/q(xₜ)',
    '    n[xₜ] ← n[xₜ] + 1         // 学习',
  ])}
  <p class="small">α = 1：Laplace；α = ½：Krichevsky–Trofimov（KT）。解码器看到相同的前缀、维护相同的计数，所以<b>不需要传输任何参数</b>。</p>
  ${env('Definition', 'regret', `对 ${mi(t`x_{1:T}`)} 上的序贯预测器 <span class="nb">${mi(t`q_t`)}：</span>${md(t`\text{Reg}_T=\sum_{t=1}^{T}\log_2\frac{1}{q_t(x_t)}-\min_{\theta}\sum_{t=1}^{T}\log_2\frac{1}{\theta(x_t)},`, 'sm')}即相比事后最好的固定分布多出的码长。`, { label: 'regret', k: 1 })}
 </div>
 <div>${step(2, linePlot({ w: 596, h: 400, x: [0, KT.N], y: [0, 12], xt: [0, 500, 1000, 1500, 2000], yt: [0, 4, 8, 12], xl: 'T（已编码的符号数）', yl: 'regret（比特）', label: 'Laplace and KT regret on a Bernoulli(0.2) sequence',
   series: [
     { cls: 'curve3', pts: Array.from({ length: 200 }, (_, i) => { const n = 1 + i * (KT.N - 1) / 199; return [n, log2(n + 1)]; }) },
     { cls: 'curve2', pts: Array.from({ length: 200 }, (_, i) => { const n = 1 + i * (KT.N - 1) / 199; return [n, .5 * log2(n) + 1]; }) },
     { cls: 'curveL', pts: KT.lpts }, { cls: 'curve', pts: KT.pts }],
   legend: [{ cls: 'curveL', label: 'Laplace 的 regret' }, { cls: 'curve3', label: 'log₂(T+1)' }, { cls: 'curve', label: 'KT 的 regret' }, { cls: 'curve2', label: '(1/2)·log₂T + 1' }], legendAt: [330, 240] }))}
 <p class="cap" data-step="2">在 p(1) = 0.2 的二元序列上计算，随机种子固定。两种 regret 在每个前缀上都低于各自的上界（已断言）。</p></div>
</div>
${key('自适应压缩器的冗余 = log 损失下在线学习者的 regret。', 3)}`,
notes: NOTES_ZH[27] });

add({ part: 2, proof: true, title: 'Laplace 估计量的 regret', body: `
${env('Theorem', 'Laplace，二元字母表', `对每个 <span class="nb">${mi(t`x_{1:T}\in\{0,1\}^T`)}，</span>加一预测器 ${mi(t`q_t(1)=\frac{n_1+1}{t+1}`)}（${mi(t`n_1`)} = 目前见到的 1 的个数）满足 <span class="nb">${mi(t`\text{Reg}_T\le\log_2(T+1)`)}。</span>`, { label: 'lap' })}
${proof(`设 ${mi(t`n_0,n_1`)} 为最终计数，<span class="nb">${mi(t`n_0+n_1=T`)}。</span>
 <ol class="psteps">
  ${step(1, `<b>望远镜。</b> 某个符号第 ${mi('(k+1)')} 次出现时，分子是 <span class="nb">${mi('k+1')}；</span>时刻 ${mi('t')} 的分母是 <span class="nb">${mi('t+1')}。</span>因此 ${md(t`\prod_{t=1}^{T}q_t(x_t)=\frac{n_0!\,n_1!}{(T+1)!}=\frac{1}{(T+1)\binom{T}{n_1}}.`, 'sm')}`, 'li')}
  ${step(2, `<b>最好的固定硬币。</b> ${mi(t`\binom{T}{n_1}\theta^{n_1}(1-\theta)^{n_0}`)} 是二项分布的一项，所以 <span class="nb">${mi(t`\max_\theta\,\theta^{n_1}(1-\theta)^{n_0}\le 1/\binom{T}{n_1}`)}。</span>`, 'li')}
  ${step(3, `<b>相除。</b> ${mi(t`\text{Reg}_T=\log_2\frac{\max_\theta\theta^{n_1}(1-\theta)^{n_0}}{\prod_t q_t(x_t)}\le\log_2\frac{(T+1)\binom{T}{n_1}}{\binom{T}{n_1}}=\log_2(T+1).`)}`, 'li')}
 </ol>`, { k: 1 })}
${remark(`KT（<span class="nb">${mi(t`\alpha=\tfrac12`)}）</span>把它改进到 <span class="nb">${mi(t`\tfrac12\log_2 T+1`)}；</span>对 ${mi('K')} 个符号为 <span class="nb">${mi(t`\tfrac{K-1}{2}\log_2 T+O(1)`)}，</span>在相差 ${mi('O(1)')} 的意义下最优（Krichevsky–Trofimov 1981）。`, 4)}
${key('每符号冗余 ≤ log₂(T+1)/T → 0：模型免费学会了信源。', 5)}`,
notes: NOTES_ZH[28] });

/* ---------------- Part IV: Deep Models ---------------- */
add({ part: 3, title: '对数损失就是码长：每个预测器都是压缩器', body: `
<div class="cols" style="--c:1fr 560px;--g:44px">
 <div>
  ${env('Proposition', '预测器 ⇒ 压缩器', `序贯预测器 ${mi(t`p(\cdot\mid x_{<i})`)} 加上算术编码，构成一个前缀码（${mi('n')} 固定），且 ${md(t`\ell(x_{1:n})<\sum_{i=1}^{n}\log_2\frac{1}{p(x_i\mid x_{<i})}+2.`, 'sm')}`, { label: 'p2c' })}
  ${proof(`链式法则 <span class="nb">${mi(t`P(x_{1:n})=\prod_i p(x_i\mid x_{<i})`)}，</span>再用${ref('acthm')}。`)}
  ${env('Proposition', '压缩器 ⇒ 预测器', `前缀码 ${mi(t`\ell`)} 定义了 <span class="nb">${mi(t`q(x)=2^{-\ell(x)}`)}，</span>满足 <span class="nb">${mi(t`\sum_x q(x)\le 1`)}，</span>由此得到条件分布 <span class="nb">${mi(t`\hat q(b\mid h)\propto 2^{-[\ell(hb)-\ell(h)]}`)}。</span>`, { label: 'c2p', k: 1 })}
  ${proof(`${ref('kraft')}。`, { k: 1 })}
 </div>
 ${step(2, `<div><h3>LLM 之前的证据</h3><ul class="small">
   <li><b>PPM</b>（Cleary &amp; Witten 1984）：用最长的匹配上下文来预测；不行就退回到更短的上下文。</li>
   <li><b>上下文混合 / PAQ</b>（Mahoney，2002–）：多个模型按在线学习的权重混合，再接一个二元算术编码器。</li>
   <li><b>Hutter Prize</b>（2006–；现为 1 GB 维基百科）：解压器的大小也计入成绩。获胜者都使用上下文混合。</li></ul></div>`)}
</div>
${key(`交叉熵损失就是码长：${mi(t`n\cdot\text{CE}_{\text{nats}}/\ln 2`)} 比特。训练语言模型就是最小化其训练数据的压缩长度。`, 3)}`,
notes: NOTES_ZH[30] });

add({ part: 3, title: 'Delétang 等（ICLR 2024）：把 LLM 当作无损压缩器', body: `
${flow([{ v: '1 GB 字节' }, { box: '分块', v: '2048 字节' }, { box: '冻结的 LM', v: 'Chinchilla / Llama 2', s: '不做微调' }, { box: '预测', v: mi(t`p(x_i\mid x_{<i})`) }, { box: '算术编码器', v: '精确', hot: true }, { v: '比特' }])}
<div class="cols" style="margin-top:30px">
 <div>
  <h3>数据（各 1 GB）</h3>
  <ul class="small">
   <li><b>enwik9</b>：文本，英文维基百科的前 10⁹ 字节</li>
   <li><b>ImageNet</b>：32×64 灰度图块，每像素一个字节</li>
   <li><b>LibriSpeech</b>：16 kHz 语音，切成 2048 字节一段</li></ul>
 </div>
 <div>
  <h3>对比基线</h3>
  <ul class="small">
   <li>通用：gzip、LZMA2</li>
   <li>领域专用：PNG（图像）、FLAC（音频）</li>
   <li>在 enwik8 上训练的小型 Transformer</li></ul>
  <p class="small">指标：<b>压缩率</b> = 压缩后大小 / 原始大小（越低越好）。由${ref('p2c')}，它就是换了个形式的模型对数损失。</p>
 </div>
</div>
<p class="cap" style="margin-top:auto">Delétang 等，“Language Modeling Is Compression”，ICLR 2024，arXiv:2309.10668，§3 与 §3.1。</p>`,
notes: NOTES_ZH[31] });

add({ part: 3, title: '只用文本训练的 Chinchilla 70B，在 PNG 和 FLAC 的主场击败了它们', body: `
<div class="cols" style="--c:620px 1fr;--g:56px">
 <div>${barsFig()}<p class="cap">按 Delétang 等（2024）摘要中的数字重绘：压缩后大小占原始大小的百分比（越低越好）。这里不计入模型参数。</p></div>
 <div>
  <p class="lead">Chinchilla 几乎只在文本上训练，却比领域专用的编解码器压缩得更好。</p>
  <p class="small">它在<b>上下文中</b>适应：一段 2048 字节的数据就足以让它判断自己看到的是像素还是音频采样。</p>
  <p class="small muted">论文 Table 1（2048 字节分块）给出 Chinchilla 70B 的结果为 48.0%（ImageNet）和 21.0%（LibriSpeech）。相对 PNG 和 FLAC 的排序不变。</p>
 </div>
</div>
${key('强大的通用预测器，就是强大的通用压缩器。', 1)}`,
notes: NOTES_ZH[32] });

add({ part: 3, title: '转折：把模型本身的大小也算进去', body: `
<div class="cols" style="--c:1fr 660px;--g:48px">
 <div>
  ${env('Definition', '调整后的压缩率', `两部分码（MDL）还要为模型本身付费：${md(t`\text{rate}_{\text{adj}}=\frac{|\theta|+L(x\mid\theta)}{|x|},`, 'sm')}其中 ${mi(t`|\theta|`)} = 每个参数 2 字节（float16）。`)}
  <table class="t mono" style="font-size:20px"><tr><th>enwik9，1 GB</th><th class="r">原始</th><th class="r">调整后</th></tr>
   <tr><td>gzip</td><td class="r">32.3%</td><td class="r">32.3%</td></tr>
   <tr><td>Chinchilla 1B</td><td class="r">11.3%</td><td class="r">211.3%</td></tr>
   <tr><td>Chinchilla 7B</td><td class="r">10.2%</td><td class="r">1410.2%</td></tr>
   <tr><td>Chinchilla 70B</td><td class="r">8.3%</td><td class="r"><b>14008.3%</b></td></tr></table>
  <p class="cap">Delétang 等（2024）的 Table 1。70B 参数 × 2 字节 = 140 GB ≫ 1 GB 数据。</p>
 </div>
 ${step(1, `<div><div class="paper"><img src="${IMG.deletang2}" alt="Delétang 等 Figure 2：调整后压缩率与模型大小"></div>
 <p class="cap">Delétang 等（2024）的 Figure 2：在 enwik8 上训练、在 enwik7/8/9 上评估的 Transformer，其调整后压缩率随模型大小的变化（双对数坐标）。每个数据规模都有各自的最优模型大小。</p></div>`)}
</div>
${key('只有数据足够多，模型才能“回本”。缩放规律取决于数据集的大小。', 2)}`,
notes: NOTES_ZH[33] });

add({ part: 3, title: '压缩器能生成；分词器在压缩', body: `
<div class="cols" style="--g:44px">
 <div>
  ${env('Definition', '压缩器作为生成器', `对输出长度为 ${mi(t`\ell_c`)} 的压缩器，${md(t`\hat\rho(b\mid x_{<i}) \propto 2^{\,\ell_c(x_{<i})-\ell_c(x_{<i}b)}`, 'sm')}（Delétang 等 §3.4；参见${ref('c2p')}）。`)}
  <p class="small">给每个可能的下一个字节 ${mi('b')} 打分、归一化、采样、追加，如此重复。用 gzip 这样采样出的图像充满噪声；Chinchilla 70B 给出的续写合理得多。</p>
 </div>
 ${step(1, `<div>
  <h3>分词就是压缩</h3>
  <p class="small">BPE 用 token ID 替换高频字节串，是一种字典编码。token 越长，固定长度的上下文就能装下越多字节，但模型要在更大的字母表上做预测。</p>
  <table class="t mono" style="font-size:19px"><tr><th>分词器</th><th class="r">200K 参数</th><th class="r">6.4M</th><th class="r">38M</th></tr>
   <tr><td>ASCII</td><td class="r">22.9</td><td class="r"><b>13.6</b></td><td class="r"><b>6.4</b></td></tr>
   <tr><td>BPE 1K</td><td class="r">25.4</td><td class="r">14.8</td><td class="r">6.9</td></tr>
   <tr><td>BPE 20K</td><td class="r"><b>19.3</b></td><td class="r">16.4</td><td class="r">9.0</td></tr></table>
  <p class="cap">enwik9 上的原始压缩率（%），Transformer 在 enwik8 上训练；摘自 Delétang 等（2024）Table 2。</p>
 </div>`)}
</div>
${key('最佳分词器取决于模型规模。在编码器运行之前，表示方式与模型就已经相互影响。', 2)}`,
notes: NOTES_ZH[34] });

add({ part: 3, title: 'Huang 等（COLM 2024）：BPC 越低 ⇒ 基准分数越高', body: `
<div class="cols" style="--c:880px 1fr;--g:40px">
 <div><div class="paper"><img src="${IMG.huang1}" alt="Huang 等 Figure 1：平均基准分数与 BPC"></div>
  <p class="cap">Huang 等（2024）的 Figure 1：平均基准分数与 BPC 的关系；每个点是一个开源基座 LLM。ρ = Pearson 相关系数，e = 线性拟合的 RMSE。</p></div>
 <div>
  <p class="small"><b>31</b> 个开源基座 LLM，<b>12</b> 个基准，分属三个领域：知识与常识、代码、数学推理；BPC 在模型训练<b>之后</b>收集的语料上计算（Common Crawl、GitHub、arXiv；2023 年）。</p>
  ${env('Definition', '每字符比特数', `${md(t`\text{BPC}=\frac{1}{\#\text{字符}}\sum_{i}\log_2\frac{1}{p(t_i\mid t_{<i})}`, 'sm')}按字符而不是按 token 归一化，所以不同分词器之间可以比较。`)}
  ${step(1, `<table class="t mono" style="font-size:19px"><tr><th>领域</th><th class="r">Pearson ρ</th></tr><tr><td>总体</td><td class="r">−0.931</td></tr><tr><td>知识</td><td class="r">−0.935</td></tr><tr><td>代码</td><td class="r">−0.937</td></tr><tr><td>数学</td><td class="r">−0.953</td></tr></table>`)}
 </div>
</div>`,
notes: NOTES_ZH[35] });

add({ part: 3, title: '注意：这条直线说明了什么，没说明什么', body: `
<div class="cols" style="--c:760px 1fr;--g:44px">
 <div><div class="paper"><img src="${IMG.huang4}" alt="Huang 等 Figure 4：数学推理分数与 BPC，含离群点"></div>
  <p class="cap">Huang 等（2024）的 Figure 4：数学推理分数与 arXiv 数学 BPC 的关系。红色菱形是被 MIN-K% PROB 方法标记为可能过拟合基准的 Qwen 模型；它们被排除在拟合之外。</p></div>
 <ul class="small">
  <li><b>相关不是因果。</b> 规模、数据和训练配方同时决定 BPC 和分数。</li>
  ${step(1, `<b>基准可以被刷。</b> 过拟合基准的模型落在直线上方。`, 'li')}
  ${step(2, `<b>语料必须与能力匹配。</b> 数学分数与 Common Crawl BPC、或知识分数与 GitHub BPC 的相关性要弱得多（§4.2）。`, 'li')}
  ${step(3, `<b>这里的“智能”只是 12 个基准的平均分</b>，对象是训练配方大体相近的基座模型；数据污染和分词器的影响仍是混杂因素。`, 'li')}
 </ul>
</div>
${key('压缩是一个便宜、无需标注的代理指标，但只在同一类模型、匹配的领域内有效。', 4)}`,
notes: NOTES_ZH[36] });

add({ part: 3, title: '最优压缩输出噪声', body: `
<div class="cols" style="--c:minmax(0,1fr) minmax(0,560px);--g:48px">
 <div>
  ${env('Proposition', '最优码 = 随机比特', `设无损编码把 ${mi('X')} 变成 <span class="nb">${mi(t`Y=C(X)\in\{0,1\}^m`)}。</span>则 <span class="nb">${mi(t`H(Y)=H(X)\le m`)}，</span>并且 ${md(t`\boxed{H(Y)=m\iff Y\sim\operatorname{Uniform}(\{0,1\}^m)}`, 'sm')}`, { label: 'noise' })}
  ${proof(`
  <ol class="psteps">
   ${step(1, `<b>压缩不损失信息。</b>无损 ⇒ ${mi('C')} 是单射 ⇒ <span class="nb">${mi(t`\boxed{H(Y)=H(X)}`)}。</span>`, 'li')}
   ${step(2, `<b>${mi('m')} 位串最多承载 ${mi('m')} 比特。</b>由链式法则，${md(t`H(Y)=\sum_{i=1}^{m}H(Y_i\mid Y_1,\dots,Y_{i-1})\;\overset{(1)}{\le}\;\sum_{i=1}^{m}H(Y_i)\;\overset{(2)}{\le}\;m.`, 'sm')}`, 'li')}
   ${step(3, `<b>何时取等？</b>(1) 取等当且仅当每一位 ${mi(t`Y_i`)} 与之前所有位独立；(2) 取等当且仅当每一位 <span class="nb">${mi(t`Y_i\sim\operatorname{Bernoulli}(1/2)`)}。</span>合起来：${mi('Y')} 均匀分布。`, 'li')}
  </ol>`, { k: 1 })}
 </div>
 <div>
  ${box('推论', `<p>码长做到 ${mi(t`m\approx H(X)`)}（最好的情况）时，码就是<b>纯噪声</b>：只要还有规律，就还能再压。</p>`, 4)}
  ${step(5, `<p class="small" style="margin:0 0 6px"><b>反过来读：</b>把公平硬币喂给解码器，得到的就是样本 <span class="nb">${mi(t`X\sim p`)}。</span></p>${md(t`\text{数据}\;\xrightarrow{\;\text{编码}\;}\;\text{噪声}\;\xrightarrow{\;\text{解码}\;}\;\text{数据}`, 'sm')}`)}
  ${step(6, `<p class="small" style="margin:0"><b>VAE</b> 把两个箭头都学出来，只是用高斯噪声 ${mi(t`z\sim\mathcal N(0,I)`)} 代替比特（下一页）。</p>`)}
 </div>
</div>
${key('完美的压缩器输出纯噪声；解码噪声就生成数据。', 7)}`,
notes: `从熵的角度看“最优压缩 = 噪声”。命题：无损压缩 C 把 X 变成 m 位串 Y。第一步：无损 ⇒ C 是单射 ⇒ H(Y) = H(X)，压缩没有丢任何信息。第二步：m 位串最多承载 m 比特，链式法则 H(Y) = Σ H(Y_i | Y_<i) ≤ Σ H(Y_i) ≤ m。第三步：两个不等式的取等条件——(1) 每一位与之前所有位独立；(2) 每一位都是 Bernoulli(1/2)，0、1 等概率。合起来：H(Y) = m 当且仅当 Y 在 {0,1}^m 上均匀分布。推论：码长做到 m ≈ H(X)（最好的情况）时，码就是纯噪声；只要还有规律，就还能再压。反过来读：把公平硬币喂给（算术编码的）解码器，输出就是从 p 采样。VAE 把编码、解码两个箭头都用神经网络学出来，只是噪声换成了高斯 N(0,I)——下一页。` });

add({ part: 3, proof: true, title: 'VAE：学会把数据编码成噪声', body: `
<div class="cols" style="--c:minmax(0,710px) minmax(0,1fr);--g:40px">
 <div>
  ${env('Definition', 'VAE', `先验 <span class="nb">${mi(t`p(z)=\mathcal N(0,I)`)}；</span>解码器 <span class="nb">${mi(t`p_\theta(x\mid z)`)}；</span>编码器 <span class="nb">${mi(t`q_\phi(z\mid x)=\mathcal N\big(\mu_\phi(x),\operatorname{diag}\sigma_\phi^2(x)\big)`)}，</span>都是神经网络。我们想让 ${mi(t`\log p_\theta(x)=\log\int p_\theta(x\mid z)p(z)\,dz`)} 尽量大，但这个积分<span class="nb">算不出来。</span>`)}
  ${env('Theorem', '证据下界', `对每个 <span class="nb">${mi('x')}，</span><span class="nb">${mi(t`\log p_\theta(x)\ge\mathrm{ELBO}(x)`)}，其中</span>${md(t`\mathrm{ELBO}(x)=\underbrace{\mathbb{E}_{q_\phi(z\mid x)}\big[\log p_\theta(x\mid z)\big]}_{\text{重建项}}-\underbrace{D_{\mathrm{KL}}\big(q_\phi(z\mid x)\,\|\,p(z)\big)}_{\text{KL 正则项}}.`, 'sm')}`, { label: 'elbo', k: 1 })}
  ${step(3, `<p class="small" style="margin:0 0 4px"><b>训练目标：</b>对两个网络同时最大化 ELBO，</p>${md(t`\max_{\theta,\phi}\;\sum_{x\in\text{data}}\mathrm{ELBO}(x),`, 'sm')}`)}
 </div>
 <div>
  ${proof(`乘除 <span class="nb">${mi(t`q_\phi(z\mid x)`)}，</span>再用 Jensen 不等式（${mi(t`\log`)} 是凹函数）：${md(t`\begin{aligned}\log p_\theta(x)&=\log\mathbb{E}_{q_\phi(z\mid x)}\Big[\frac{p_\theta(x\mid z)\,p(z)}{q_\phi(z\mid x)}\Big]\\&\ge\mathbb{E}_{q_\phi(z\mid x)}\Big[\log p_\theta(x\mid z)+\log\frac{p(z)}{q_\phi(z\mid x)}\Big]\\&=\mathbb{E}_{q_\phi(z\mid x)}\big[\log p_\theta(x\mid z)\big]-D_{\mathrm{KL}}\big(q_\phi(z\mid x)\,\|\,p(z)\big).\end{aligned}`, 'sm')}间隙恰好是 ${md(t`\log p_\theta(x)-\mathrm{ELBO}(x)=D_{\mathrm{KL}}\big(q_\phi(z\mid x)\,\|\,p_\theta(z\mid x)\big)\ge 0`, 'sm')}`, { k: 2 })}
  ${step(3, `<p class="small" style="margin:0"><b>重参数化：</b>${mi(t`z=\mu_\phi(x)+\sigma_\phi(x)\odot\varepsilon,\quad\varepsilon\sim\mathcal N(0,I)`)}，梯度才能传到 <span class="nb">${mi(t`\phi`)}。</span>高斯情形下 KL 有闭式：</p>${md(t`D_{\mathrm{KL}}=\tfrac12\sum_j\big(\mu_j^2+\sigma_j^2-1-\log\sigma_j^2\big).`, 'sm')}`)}
 </div>
</div>
${key('最大化 ELBO：既要把 x 重建好，又要让它的码 z 接近纯噪声 N(0, I)。', 4)}`,
notes: `VAE 这一页完整推导训练目标。定义：先验 p(z) = N(0,I)，解码器 p_θ(x|z)，编码器 q_φ(z|x) 是对角高斯，均值和方差由网络输出。理想目标是最大化似然 log p_θ(x) = log ∫ p_θ(x|z)p(z)dz（也就是最小化理想码长 log 1/p_θ(x)），但对 z 的积分算不出来。定理（ELBO）：log p_θ(x) ≥ ELBO(x) = E_q[log p_θ(x|z)] − KL(q_φ(z|x) ‖ p(z))。证明三行：第一行在积分里乘除 q_φ(z|x)，把积分写成对 q 的期望；第二行 log 是凹函数，Jensen 把 log 移进期望；第三行把 log p(z)/q 的期望写成负 KL。间隙恰好是 KL(q_φ(z|x) ‖ p_θ(z|x))，编码器越接近真实后验，下界越紧。训练目标：对 θ 和 φ 同时最大化所有数据上的 ELBO 之和。两项的含义：重建项要求从 z 能把 x 解码回来；KL 正则项要求编码 z 的分布接近 N(0,I)——也就是让码看起来像噪声，正好呼应上一页“最优码 = 噪声”。工程细节：重参数化 z = μ + σ⊙ε，把随机性放进 ε，梯度才能传到编码器；高斯之间的 KL 有闭式 ½Σ(μ² + σ² − 1 − log σ²)。生成时只需从 N(0,I) 采样 z 再解码。` });
